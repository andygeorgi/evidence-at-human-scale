<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1615" width="360" height="1615" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Reference architecture</title>
<desc id="d">A main path of nine numbered steps from sources to review of one decision packet; a separate mandatory continuity path that branches from the registry; a separate action path that starts from the review; a reassessment and invalidation step that receives corrections and outcomes; and a control plane that constrains every stage.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="1615" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="721.4" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="34.4" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">MAIN PATH</text>
<text x="24.0" y="53.5" font-size="13" text-anchor="start" fill="#9da7b3">nine steps to one review contract</text>
<rect x="52.0" y="66.3" width="288.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="62.0" y="90.3" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Sources</text>
<text x="62.0" y="111.4" font-size="13" text-anchor="start" fill="#CDE4FF">records, events, services, analytics</text>
<circle cx="32.0" cy="87.3" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="91.9" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">1</text>
<rect x="52.0" y="136.2" width="288.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="62.0" y="160.2" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Admission</text>
<text x="62.0" y="181.3" font-size="13" text-anchor="start" fill="#CDE4FF">registered producer, permitted kind</text>
<circle cx="32.0" cy="157.2" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="161.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">2</text>
<path d="M32.0 100.3 L32.0 144.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="206.1" width="288.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="62.0" y="230.1" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Registry (C02)</text>
<text x="62.0" y="251.2" font-size="13" text-anchor="start" fill="#CDE4FF">admitted immutable versions</text>
<circle cx="32.0" cy="227.1" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="231.7" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">3</text>
<path d="M32.0 170.2 L32.0 214.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="276.0" width="288.0" height="78.7" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="62.0" y="300.0" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Authorized retrieval</text>
<text x="62.0" y="318.7" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">(context C01)</text>
<text x="62.0" y="339.9" font-size="13" text-anchor="start" fill="#CFF6F9">candidate evidence and coverage</text>
<circle cx="32.0" cy="297.0" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="301.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">4</text>
<path d="M32.0 240.1 L32.0 284.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="364.7" width="288.0" height="59.9" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="62.0" y="388.7" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Relevance and coverage</text>
<text x="62.0" y="409.8" font-size="13" text-anchor="start" fill="#CFF6F9">priority, grouping, exclusions</text>
<circle cx="32.0" cy="385.7" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="390.3" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">5</text>
<path d="M32.0 310.0 L32.0 372.7" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="434.6" width="288.0" height="59.9" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="62.0" y="458.6" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Selection manifest (C03)</text>
<text x="62.0" y="479.7" font-size="13" text-anchor="start" fill="#CFF6F9">retrieved, kept, excluded, missing</text>
<circle cx="32.0" cy="455.6" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="460.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">6</text>
<path d="M32.0 398.7 L32.0 442.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="504.5" width="288.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="62.0" y="528.5" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Bounded synthesis</text>
<text x="62.0" y="549.6" font-size="13" text-anchor="start" fill="#D2F8DB">candidate decision packet</text>
<circle cx="32.0" cy="525.5" r="12" fill="#56D364" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="530.1" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">7</text>
<path d="M32.0 468.6 L32.0 512.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="574.4" width="288.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="62.0" y="598.4" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Release validation</text>
<text x="62.0" y="619.5" font-size="13" text-anchor="start" fill="#D2F8DB">claim, reference, disclosure checks</text>
<circle cx="32.0" cy="595.4" r="12" fill="#56D364" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="600.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">8</text>
<path d="M32.0 538.5 L32.0 582.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="644.3" width="288.0" height="77.1" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="62.0" y="668.3" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Review of the packet (C04)</text>
<text x="62.0" y="689.4" font-size="13" text-anchor="start" fill="#E6DAFF">the Decision Owner</text>
<text x="62.0" y="706.6" font-size="13" text-anchor="start" fill="#E6DAFF">inspects and challenges</text>
<circle cx="32.0" cy="665.3" r="12" fill="#A371F7" stroke="#A371F7" stroke-width="1.6"/>
<text x="32.0" y="669.9" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">9</text>
<path d="M32.0 608.4 L32.0 652.3" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="747.4" width="340.0" height="227.7" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="771.8" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">MANDATORY CONTINUITY PATH</text>
<text x="24.0" y="790.9" font-size="13" text-anchor="start" fill="#9da7b3">branches from step 3 · no LLM dependency</text>
<rect x="22.0" y="803.7" width="316.0" height="38.8" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="827.7" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Deterministic detection</text>
<path d="M180.0 842.5 L180.0 857.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="858.5" width="316.0" height="38.8" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="882.4" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Authorized notification and queue</text>
<path d="M180.0 897.2 L180.0 912.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="913.2" width="316.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="937.2" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Acknowledgement or escalation</text>
<text x="32.0" y="958.3" font-size="13" text-anchor="start" fill="#CDE4FF">receipt, not resolution</text>
<rect x="10.0" y="991.1" width="340.0" height="320.8" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="1015.5" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">ACTION PATH</text>
<text x="24.0" y="1034.7" font-size="13" text-anchor="start" fill="#9da7b3">starts at step 9, the review</text>
<rect x="22.0" y="1047.5" width="316.0" height="77.1" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="32.0" y="1071.4" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Approval</text>
<text x="32.0" y="1092.6" font-size="13" text-anchor="start" fill="#E6DAFF">of an exact proposal (C05),</text>
<text x="32.0" y="1109.7" font-size="13" text-anchor="start" fill="#E6DAFF">or a bounded grant (C06)</text>
<path d="M180.0 1124.5 L180.0 1139.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1140.5" width="316.0" height="59.9" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="32.0" y="1164.5" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Executor</text>
<text x="32.0" y="1185.6" font-size="13" text-anchor="start" fill="#FFEBC2">current checks: permission, limits</text>
<path d="M180.0 1200.4 L180.0 1215.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1216.4" width="316.0" height="38.8" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="1240.4" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Authoritative target</text>
<path d="M180.0 1255.2 L180.0 1270.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1271.2" width="316.0" height="38.8" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="1295.1" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Verified receipt (C07)</text>
<path d="M180.0 1311.9 L180.0 1340.9" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="190.0" y="1331.5" font-size="13" text-anchor="start" fill="#9da7b3">outcome</text>
<rect x="10.0" y="1341.9" width="340.0" height="128.6" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="20.0" y="1365.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Reassessment and invalidation</text>
<text x="20.0" y="1387.0" font-size="13" text-anchor="start" fill="#FFEBC2">Corrections, revocations, late evidence,</text>
<text x="20.0" y="1404.2" font-size="13" text-anchor="start" fill="#FFEBC2">challenges and verified outcomes arrive</text>
<text x="20.0" y="1421.4" font-size="13" text-anchor="start" fill="#FFEBC2">here. This step returns to the registry</text>
<text x="20.0" y="1438.5" font-size="13" text-anchor="start" fill="#FFEBC2">(step 3): affected derivatives, packets</text>
<text x="20.0" y="1455.7" font-size="13" text-anchor="start" fill="#FFEBC2">and pending approvals stop being current.</text>
<rect x="10.0" y="1486.5" width="340.0" height="117.8" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="1510.8" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">CONTROL PLANE</text>
<text x="24.0" y="1530.0" font-size="13" text-anchor="start" fill="#9da7b3">constrains every stage and path</text>
<text x="24.0" y="1556.1" font-size="14" text-anchor="start" fill="#e6edf3">identity · authorization · purpose</text>
<text x="24.0" y="1574.6" font-size="14" text-anchor="start" fill="#e6edf3">domain policy · inventory · freshness</text>
<text x="24.0" y="1593.1" font-size="14" text-anchor="start" fill="#e6edf3">budgets · delegation</text>
</svg>
