<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 553" width="360" height="553" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Complexity must earn its place</title>
<desc id="d">Four numbered steps in order: native or current workflow, deterministic grouping and templates, simple synthesis with zero specialists, optional specialists. Arrows between them ask whether the next step is better on matched tasks, and whether there is a measured, matched need. Two cards follow: one lists the measures, the other says no evaluation result is claimed and no comparison has been run.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="553" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="38.8" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="31.0" cy="31.0" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="31.0" y="35.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">1</text>
<text x="50.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Native or current workflow</text>
<path d="M30.0 48.8 L30.0 83.8" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="46.0" y="71.3" font-size="13" text-anchor="start" fill="#9da7b3">is the next step better on matched tasks?</text>
<rect x="10.0" y="84.8" width="340.0" height="57.5" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="31.0" cy="105.8" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="31.0" y="110.3" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">2</text>
<text x="50.0" y="108.7" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Deterministic grouping</text>
<text x="50.0" y="127.5" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">and templates</text>
<path d="M30.0 142.2 L30.0 177.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="46.0" y="164.8" font-size="13" text-anchor="start" fill="#9da7b3">better on matched tasks?</text>
<rect x="10.0" y="178.2" width="340.0" height="59.9" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="31.0" cy="199.2" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="31.0" y="203.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">3</text>
<text x="50.0" y="202.2" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Simple synthesis, zero specialists</text>
<text x="50.0" y="223.3" font-size="13" text-anchor="start" fill="#e6edf3">a complete architecture on its own</text>
<path d="M30.0 238.2 L30.0 273.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="46.0" y="260.8" font-size="13" text-anchor="start" fill="#9da7b3">a measured, matched need?</text>
<rect x="10.0" y="274.2" width="340.0" height="77.1" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="31.0" cy="295.2" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="31.0" y="299.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">4</text>
<text x="50.0" y="298.1" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Optional specialists</text>
<text x="50.0" y="319.3" font-size="13" text-anchor="start" fill="#e6edf3">admitted only for a documented</text>
<text x="50.0" y="336.4" font-size="13" text-anchor="start" fill="#e6edf3">task, permission or isolation need</text>
<rect x="10.0" y="373.2" width="340.0" height="97.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="20.0" y="397.2" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Measure</text>
<text x="20.0" y="418.3" font-size="13" text-anchor="start" fill="#CDE4FF">correctness · omissions · evidence actually</text>
<text x="20.0" y="435.5" font-size="13" text-anchor="start" fill="#CDE4FF">inspected · decision quality · time · workload</text>
<text x="20.0" y="455.6" font-size="13" text-anchor="start" fill="#CDE4FF">Not fluency. Not how many agents agree.</text>
<rect x="10.0" y="482.5" width="340.0" height="59.9" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="20.0" y="506.4" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">No evaluation result is claimed</text>
<text x="20.0" y="527.6" font-size="13" text-anchor="start" fill="#FFEBC2">No comparison has been run.</text>
</svg>
