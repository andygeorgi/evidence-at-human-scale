<text x="32.0" y="546.6" font-size="13" text-anchor="start" fill="#FFD8D3">source record</text>
<path d="M136.0 534.5 L216.0 534.5" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
