<path d="M136.0 599.4 L216.0 599.4" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="177.0" y="587.4" font-size="13" text-anchor="middle" fill="#9da7b3">supersedes</text>
<rect x="220.0" y="584.4" width="118.0" height="26.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="279.0" y="601.9" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">S01/v1</text>
<path d="M136.0 649.4 L216.0 649.4" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="177.0" y="637.4" font-size="13" text-anchor="middle" fill="#9da7b3">invalidates</text>
<rect x="220.0" y="634.4" width="118.0" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="279.0" y="651.9" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">M01 · M02</text>
<rect x="22.0" y="681.4" width="112.0" height="77.1" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="705.4" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">V01/v1</text>
