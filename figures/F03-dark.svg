<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 779" width="360" height="779" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Common-source agreement is not corroboration</title>
<desc id="d">Source record S01 version 1 is the single parent of model inferences M01 and M02, which both feed decision packet P01 together with a conflicting record S02: their agreement is common origin, not corroboration. Dashed arrows are assertions, not ancestry: S02 contradicts S01; S01 version 2 supersedes S01 version 1 and invalidates M01 and M02; V01 validates S01 version 1 only.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="779" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="403.2" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<path d="M24.0 24.0 L56.0 24.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="64.0" y="28.6" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">Derivation: solid arrows</text>
<rect x="100.0" y="44.0" width="160.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="180.0" y="68.0" font-size="15" text-anchor="middle" font-weight="700" fill="#CDE4FF">S01/v1</text>
<text x="180.0" y="89.1" font-size="13" text-anchor="middle" fill="#CDE4FF">source record</text>
<path d="M180.0 103.9 L180.0 122.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20.0" y="123.9" width="320.0" height="156.1" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="142.9" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">One origin: both derive from S01/v1</text>
<rect x="30.0" y="151.9" width="145.0" height="80.1" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="40.0" y="175.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">M01/v1</text>
<text x="40.0" y="197.0" font-size="13" text-anchor="start" fill="#FFEBC2">model inference</text>
<text x="40.0" y="217.2" font-size="13" text-anchor="start" fill="#FFEBC2">Agent A</text>
<rect x="185.0" y="151.9" width="145.0" height="80.1" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="195.0" y="175.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">M02/v1</text>
<text x="195.0" y="197.0" font-size="13" text-anchor="start" fill="#FFEBC2">model inference</text>
<text x="195.0" y="217.2" font-size="13" text-anchor="start" fill="#FFEBC2">Agent B</text>
<text x="180.0" y="252.0" font-size="13" text-anchor="middle" fill="#9da7b3">They agree, but from one origin:</text>
<text x="180.0" y="270.0" font-size="13" text-anchor="middle" font-weight="700" fill="#e6edf3">not independent corroboration</text>
<path d="M253.0 280.0 L253.0 306.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="306.0" width="124.0" height="97.2" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="32.0" y="329.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">S02/v1</text>
<text x="32.0" y="351.1" font-size="13" text-anchor="start" fill="#FFD8D3">source record</text>
<text x="32.0" y="371.2" font-size="13" text-anchor="start" fill="#FFD8D3">conflicting</text>
<text x="32.0" y="388.4" font-size="13" text-anchor="start" fill="#FFD8D3">assertion</text>
