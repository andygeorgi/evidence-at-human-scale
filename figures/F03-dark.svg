<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 791" width="360" height="791" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Common-source agreement is not corroboration</title>
<desc id="d">Solid arrows show derivation. A goods receipt, a source record, is the only parent of two AI summaries, which are model inferences and agree from one origin. Both feed a decision packet, as does a conflicting invoice. Dashed arrows show assertions about another record: the invoice contradicts the receipt; a corrected receipt supersedes it and invalidates both summaries; a scoped validation covers the receipt only.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="791" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="383.1" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<path d="M24.0 24.0 L56.0 24.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="64.0" y="28.6" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">Derivation: solid arrows</text>
<rect x="100.0" y="44.0" width="160.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="180.0" y="68.0" font-size="15" text-anchor="middle" font-weight="700" fill="#CDE4FF">Goods receipt</text>
<text x="180.0" y="89.1" font-size="13" text-anchor="middle" fill="#CDE4FF">source record</text>
<path d="M180.0 103.9 L180.0 122.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="20.0" y="123.9" width="320.0" height="135.9" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="32.0" y="142.9" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">One origin: both rest on the receipt</text>
<rect x="30.0" y="151.9" width="145.0" height="59.9" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="40.0" y="175.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">AI summary A</text>
<text x="40.0" y="197.0" font-size="13" text-anchor="start" fill="#FFEBC2">model inference</text>
<rect x="185.0" y="151.9" width="145.0" height="59.9" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="195.0" y="175.9" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">AI summary B</text>
<text x="195.0" y="197.0" font-size="13" text-anchor="start" fill="#FFEBC2">model inference</text>
<text x="180.0" y="231.8" font-size="13" text-anchor="middle" fill="#9da7b3">They agree, but from one origin:</text>
<text x="180.0" y="249.8" font-size="13" text-anchor="middle" font-weight="700" fill="#e6edf3">not independent corroboration</text>
<path d="M253.0 259.8 L253.0 285.8" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="285.8" width="124.0" height="97.2" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="32.0" y="309.8" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">Invoice</text>
<text x="32.0" y="330.9" font-size="13" text-anchor="start" fill="#FFD8D3">source record</text>
<text x="32.0" y="351.1" font-size="13" text-anchor="start" fill="#FFD8D3">conflicting</text>
<text x="32.0" y="368.2" font-size="13" text-anchor="start" fill="#FFD8D3">assertion</text>
<rect x="168.0" y="285.8" width="170.0" height="97.2" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="178.0" y="309.8" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Decision packet</text>
<text x="178.0" y="330.9" font-size="13" text-anchor="start" fill="#D2F8DB">the conflict</text>
<text x="178.0" y="348.1" font-size="13" text-anchor="start" fill="#D2F8DB">stays visible</text>
<path d="M146.0 334.4 L168.0 334.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="409.1" width="340.0" height="371.5" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<path d="M24.0 423.1 L56.0 423.1" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="64.0" y="427.7" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">Typed relationships: dashed arrows</text>
<text x="24.0" y="451.4" font-size="13" text-anchor="start" fill="#9da7b3">Each is an assertion about</text>
<text x="24.0" y="468.6" font-size="13" text-anchor="start" fill="#9da7b3">another record, not ancestry.</text>
<rect x="22.0" y="481.4" width="100.0" height="75.8" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="32.0" y="504.4" font-size="14" text-anchor="start" font-weight="700" fill="#FFD8D3">Invoice</text>
<text x="32.0" y="525.2" font-size="13" text-anchor="start" fill="#FFD8D3">source</text>
<text x="32.0" y="542.4" font-size="13" text-anchor="start" fill="#FFD8D3">record</text>
<path d="M124.0 522.3 L210.0 522.3" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="168.0" y="510.3" font-size="13" text-anchor="middle" fill="#9da7b3">contradicts</text>
<rect x="214.0" y="507.3" width="124.0" height="26.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="276.0" y="524.7" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">Receipt v1</text>
<rect x="22.0" y="567.2" width="100.0" height="100.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="590.2" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">Corrected</text>
<text x="32.0" y="607.7" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">receipt</text>
<text x="32.0" y="628.5" font-size="13" text-anchor="start" fill="#CDE4FF">version 2</text>
<path d="M124.0 595.2 L210.0 595.2" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="168.0" y="583.2" font-size="13" text-anchor="middle" fill="#9da7b3">supersedes</text>
<rect x="214.0" y="580.2" width="124.0" height="26.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="276.0" y="597.6" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">Receipt v1</text>
<path d="M124.0 645.2 L210.0 645.2" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="168.0" y="633.2" font-size="13" text-anchor="middle" fill="#9da7b3">invalidates</text>
<rect x="214.0" y="630.2" width="124.0" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="276.0" y="647.6" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">AI summaries</text>
<rect x="22.0" y="677.2" width="100.0" height="93.3" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="700.2" font-size="14" text-anchor="start" font-weight="700" fill="#e6edf3">Scoped</text>
<text x="32.0" y="717.7" font-size="14" text-anchor="start" font-weight="700" fill="#e6edf3">validation</text>
<text x="32.0" y="738.5" font-size="13" text-anchor="start" fill="#e6edf3">of this</text>
<text x="32.0" y="755.7" font-size="13" text-anchor="start" fill="#e6edf3">record only</text>
<path d="M124.0 726.9 L210.0 726.9" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="168.0" y="714.9" font-size="13" text-anchor="middle" fill="#9da7b3">validates</text>
<rect x="214.0" y="711.9" width="124.0" height="26.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="276.0" y="729.3" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">Receipt v1</text>
</svg>
