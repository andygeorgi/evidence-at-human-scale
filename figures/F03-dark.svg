<path d="M24.0 443.2 L56.0 443.2" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="64.0" y="447.8" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">Typed relationships: dashed arrows</text>
<text x="24.0" y="471.6" font-size="13" text-anchor="start" fill="#9da7b3">Each is an assertion about</text>
<text x="24.0" y="488.7" font-size="13" text-anchor="start" fill="#9da7b3">another record, not ancestry.</text>
