<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 733" width="360" height="733" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Receipt states and recovery</title>
<desc id="d">A submitted action leads to four states. Unknown and partial are open, drawn in amber: allowance stays reserved or charged. Only authoritative reconciliation moves unknown to completed_verified or not_executed_verified. Reconciliation or compensation, under policy, moves partial to completed_verified. The states completed_verified and not_executed_verified are final, drawn in green.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="733" fill="#0d1117"/>
<rect x="34.0" y="10.0" width="316.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="44.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">submitted</text>
<text x="44.0" y="55.1" font-size="13" text-anchor="start" fill="#CDE4FF">every check passed, allowance reserved</text>
<rect x="34.0" y="97.9" width="316.0" height="160.5" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<rect x="287.7" y="105.9" width="52.3" height="23.0" rx="11.5" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="313.8" y="121.8" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">open</text>
<text x="44.0" y="122.8" font-size="16" text-anchor="start" font-weight="700" fill="#FFEBC2">unknown</text>
<text x="44.0" y="144.3" font-size="13" text-anchor="start" fill="#FFEBC2">timeout or no response</text>
<text x="44.0" y="164.4" font-size="13" text-anchor="start" fill="#FFEBC2">Only authoritative reconciliation</text>
<text x="44.0" y="181.6" font-size="13" text-anchor="start" fill="#FFEBC2">moves it on:</text>
<rect x="48.0" y="192.4" width="164.6" height="26.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="130.3" y="209.8" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">completed_verified</text>
<rect x="48.0" y="222.4" width="188.6" height="26.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="142.3" y="239.8" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">not_executed_verified</text>
<rect x="34.0" y="270.4" width="316.0" height="147.6" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<rect x="287.7" y="278.4" width="52.3" height="23.0" rx="11.5" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="313.8" y="294.3" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">open</text>
<text x="44.0" y="295.3" font-size="16" text-anchor="start" font-weight="700" fill="#FFEBC2">partial</text>
<text x="44.0" y="316.7" font-size="13" text-anchor="start" fill="#FFEBC2">some effects verified, others</text>
<text x="44.0" y="333.9" font-size="13" text-anchor="start" fill="#FFEBC2">not; known effects stay charged</text>
<text x="44.0" y="354.1" font-size="13" text-anchor="start" fill="#FFEBC2">Reconciliation or compensation,</text>
<text x="44.0" y="371.2" font-size="13" text-anchor="start" fill="#FFEBC2">under policy, moves it on:</text>
<rect x="48.0" y="382.0" width="164.6" height="26.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="130.3" y="399.4" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">completed_verified</text>
<rect x="34.0" y="430.0" width="316.0" height="61.2" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="291.3" y="438.0" width="48.7" height="23.0" rx="11.5" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="315.7" y="453.9" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">final</text>
<text x="44.0" y="454.9" font-size="16" text-anchor="start" font-weight="700" fill="#D2F8DB">completed_verified</text>
<text x="44.0" y="476.4" font-size="13" text-anchor="start" fill="#D2F8DB">an authoritative outcome confirms the effect</text>
<rect x="34.0" y="503.2" width="316.0" height="78.3" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="291.3" y="511.2" width="48.7" height="23.0" rx="11.5" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="315.7" y="527.1" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">final</text>
<text x="44.0" y="528.1" font-size="16" text-anchor="start" font-weight="700" fill="#D2F8DB">not_executed_verified</text>
<text x="44.0" y="549.5" font-size="13" text-anchor="start" fill="#D2F8DB">authoritatively verified: no effect</text>
<text x="44.0" y="566.7" font-size="13" text-anchor="start" fill="#D2F8DB">for this attempt, target and scope</text>
<path d="M34.0 40.0 L16.0 40.0 L16.0 524.2" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<path d="M16.0 118.9 L33.0 118.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 291.4 L33.0 291.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 451.0 L33.0 451.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 524.2 L33.0 524.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="593.5" width="340.0" height="128.6" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="617.5" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Open states keep the reservation</text>
<text x="20.0" y="638.6" font-size="13" text-anchor="start" fill="#e6edf3">While a state is open, allowance</text>
<text x="20.0" y="655.8" font-size="13" text-anchor="start" fill="#e6edf3">stays reserved or charged and there</text>
<text x="20.0" y="672.9" font-size="13" text-anchor="start" fill="#e6edf3">is no blind retry. A timeout or lease</text>
<text x="20.0" y="690.1" font-size="13" text-anchor="start" fill="#e6edf3">expiry never restores allowance; only</text>
<text x="20.0" y="707.2" font-size="13" text-anchor="start" fill="#e6edf3">authoritative reconciliation does.</text>
</svg>
