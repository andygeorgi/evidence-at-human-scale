<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Information production can outgrow human inspection</title>
<desc id="d">Three cards of decreasing width: a wide band of growing records, events, findings and model interpretations narrows, through a governed decision context, into one accountable Decision Owner with finite attention.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="393" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="98.5" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="180.0" y="34.0" font-size="15" text-anchor="middle" font-weight="700" fill="#CDE4FF">Information production</text>
<text x="180.0" y="52.7" font-size="15" text-anchor="middle" font-weight="700" fill="#CDE4FF">keeps growing</text>
<text x="180.0" y="74.8" font-size="14" text-anchor="middle" fill="#CDE4FF">records · events · deterministic findings</text>
<text x="180.0" y="93.3" font-size="14" text-anchor="middle" fill="#CDE4FF">analytical results · model interpretations</text>
<path d="M180.0 108.5 L180.0 155.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="137.1" font-size="13" text-anchor="start" fill="#9da7b3">authorize · select · label</text>
<rect x="36.0" y="156.5" width="288.0" height="98.2" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="180.0" y="180.4" font-size="15" text-anchor="middle" font-weight="700" fill="#CFF6F9">Governed decision context</text>
<text x="180.0" y="202.5" font-size="14" text-anchor="middle" fill="#CFF6F9">keeps what could change a</text>
<text x="180.0" y="221.0" font-size="14" text-anchor="middle" fill="#CFF6F9">decision and shows its source,</text>
<text x="180.0" y="239.5" font-size="14" text-anchor="middle" fill="#CFF6F9">scope, gaps and owner</text>
<path d="M180.0 254.7 L180.0 301.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="283.2" font-size="13" text-anchor="start" fill="#9da7b3">one decision packet</text>
<rect x="72.0" y="302.6" width="216.0" height="79.7" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="180.0" y="326.6" font-size="15" text-anchor="middle" font-weight="700" fill="#E6DAFF">Decision Owner</text>
<text x="180.0" y="348.7" font-size="14" text-anchor="middle" fill="#E6DAFF">finite attention</text>
<text x="180.0" y="367.2" font-size="14" text-anchor="middle" fill="#E6DAFF">· accountable</text>
</svg>
