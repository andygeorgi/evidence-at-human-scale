<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1045" width="360" height="1045" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Degraded information, closed execution</title>
<desc id="d">A note says execution is closed in every state when authority is invalid or uncertain. Four information states follow. Each gives what the reader sees, what review is possible and whether execution is eligible when authority is valid and current. In the last state, where authorization or revocation cannot be established, execution is Closed. A last note says urgent continuity uses its own authorized channel.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="1045" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="136.0" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="20.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">In every state, execution is</text>
<text x="20.0" y="52.7" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">Closed whenever the authority</text>
<text x="20.0" y="71.5" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">is invalid or uncertain, however</text>
<text x="20.0" y="90.2" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">good the information is.</text>
<text x="20.0" y="112.3" font-size="14" text-anchor="start" fill="#FFD8D3">The Execution entries show what is possible</text>
<text x="20.0" y="130.8" font-size="14" text-anchor="start" fill="#FFD8D3">when the authority is valid and current.</text>
<rect x="10.0" y="158.0" width="340.0" height="148.7" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="181.9" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Current and sufficient</text>
<text x="20.0" y="208.0" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Sees</text>
<text x="98.0" y="208.0" font-size="14" text-anchor="start" fill="#e6edf3">The full packet</text>
<text x="20.0" y="234.5" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Review</text>
<text x="98.0" y="234.5" font-size="14" text-anchor="start" fill="#e6edf3">Normal review</text>
<text x="20.0" y="267.0" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Execution</text>
<rect x="98.0" y="247.7" width="242.0" height="49.0" rx="6" fill="#12361F" stroke="#56D364" stroke-width="1.3"/>
<text x="106.0" y="267.0" font-size="14" text-anchor="start" fill="#D2F8DB">Eligible, after the</text>
<text x="106.0" y="285.4" font-size="14" text-anchor="start" fill="#D2F8DB">commit checks</text>
<rect x="10.0" y="316.6" width="340.0" height="204.4" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="340.6" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Qualified: stale, partial,</text>
<text x="20.0" y="359.3" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">or a source unavailable</text>
<text x="20.0" y="385.4" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Sees</text>
<text x="98.0" y="385.4" font-size="14" text-anchor="start" fill="#e6edf3">The packet with labeled</text>
<text x="98.0" y="403.9" font-size="14" text-anchor="start" fill="#e6edf3">gaps; never a clean negative</text>
<text x="20.0" y="430.4" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Review</text>
<text x="98.0" y="430.4" font-size="14" text-anchor="start" fill="#e6edf3">Limited review, limits visible</text>
<text x="20.0" y="462.9" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Execution</text>
<rect x="98.0" y="443.6" width="242.0" height="67.4" rx="6" fill="#4A3200" stroke="#E3B341" stroke-width="1.3"/>
<text x="106.0" y="462.9" font-size="14" text-anchor="start" fill="#FFEBC2">Eligible only if the action&#x27;s</text>
<text x="106.0" y="481.4" font-size="14" text-anchor="start" fill="#FFEBC2">own evidence and</text>
<text x="106.0" y="499.8" font-size="14" text-anchor="start" fill="#FFEBC2">precondition checks still pass</text>
<rect x="10.0" y="531.0" width="340.0" height="185.6" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="555.0" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Assistant model unavailable</text>
<text x="20.0" y="581.1" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Sees</text>
<text x="98.0" y="581.1" font-size="14" text-anchor="start" fill="#e6edf3">A qualified deterministic</text>
<text x="98.0" y="599.5" font-size="14" text-anchor="start" fill="#e6edf3">template, or a native or manual</text>
<text x="98.0" y="618.0" font-size="14" text-anchor="start" fill="#e6edf3">route; unsupported synthesis is</text>
<text x="98.0" y="636.5" font-size="14" text-anchor="start" fill="#e6edf3">not released as advice</text>
<text x="20.0" y="663.0" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Review</text>
<text x="98.0" y="663.0" font-size="14" text-anchor="start" fill="#e6edf3">Review from the template</text>
<text x="20.0" y="695.5" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Execution</text>
<rect x="98.0" y="676.2" width="242.0" height="30.5" rx="6" fill="#4A3200" stroke="#E3B341" stroke-width="1.3"/>
<text x="106.0" y="695.5" font-size="14" text-anchor="start" fill="#FFEBC2">As in the state above</text>
<rect x="10.0" y="726.6" width="340.0" height="148.9" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="750.6" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Authorization or revocation</text>
<text x="20.0" y="769.3" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">cannot be established</text>
<text x="20.0" y="795.4" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Sees</text>
<text x="98.0" y="795.4" font-size="14" text-anchor="start" fill="#e6edf3">Dependent disclosure withheld</text>
<text x="20.0" y="821.9" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Review</text>
<text x="98.0" y="821.9" font-size="14" text-anchor="start" fill="#e6edf3">Blocked for what depends on it</text>
<text x="20.0" y="854.4" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">Execution</text>
<rect x="98.0" y="835.1" width="242.0" height="30.5" rx="6" fill="#4D1511" stroke="#F85149" stroke-width="1.3"/>
<text x="106.0" y="854.4" font-size="14" text-anchor="start" font-weight="700" fill="#FFD8D3">Closed</text>
<rect x="10.0" y="885.6" width="340.0" height="149.4" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="20.0" y="908.9" font-size="14" text-anchor="start" fill="#e6edf3">Also in every state, urgent continuity</text>
<text x="20.0" y="927.4" font-size="14" text-anchor="start" fill="#e6edf3">(independent deterministic notification,</text>
<text x="20.0" y="945.8" font-size="14" text-anchor="start" fill="#e6edf3">queue, acknowledgement and</text>
<text x="20.0" y="964.3" font-size="14" text-anchor="start" fill="#e6edf3">escalation) uses its own authorized</text>
<text x="20.0" y="982.8" font-size="14" text-anchor="start" fill="#e6edf3">channel. If that channel fails, the failure</text>
<text x="20.0" y="1001.3" font-size="14" text-anchor="start" fill="#e6edf3">is exposed and the approved continuity</text>
<text x="20.0" y="1019.8" font-size="14" text-anchor="start" fill="#e6edf3">or escalation route is followed.</text>
</svg>
