<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1096" width="360" height="1096" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Which missingness label applies?</title>
<desc id="d">A decision list. A stale record gives stale. Otherwise a check not performed gives not_assessed, a principal not permitted gives inaccessible, no answer from the source gives unavailable, no completed scoped retrieval gives missing, an observed absence with method, time and complete coverage gives negative, and otherwise not_retrieved.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="360" height="1096" fill="#ffffff"/>
<rect x="10.0" y="10.0" width="340.0" height="57.0" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="180.0" y="33.3" font-size="14" text-anchor="middle" fill="#222222">An expected input is not</text>
<text x="180.0" y="51.8" font-size="14" text-anchor="middle" fill="#222222">in front of the reader</text>
<path d="M180.0 67.0 L180.0 92.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="84.6" font-size="13" text-anchor="start" fill="#57606a">ask in order</text>
<rect x="10.0" y="93.0" width="340.0" height="92.3" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="114.0" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="118.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="56.0" y="116.7" font-size="14.5" text-anchor="start" fill="#222222">Is a record available but failing</text>
<text x="56.0" y="135.9" font-size="14.5" text-anchor="start" fill="#222222">the freshness requirement?</text>
<text x="56.0" y="167.2" font-size="13" text-anchor="start" font-weight="700" fill="#222222">yes</text>
<path d="M89.1 162.2 L111.1 162.2" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="119.1" y="149.2" width="57.8" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="148.0" y="166.7" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">stale</text>
<path d="M180.0 185.2 L180.0 210.2" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="202.8" font-size="13" text-anchor="start" fill="#57606a">no</text>
<rect x="10.0" y="211.2" width="340.0" height="92.3" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="232.2" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="236.8" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="56.0" y="235.0" font-size="14.5" text-anchor="start" fill="#222222">Was the check or</text>
<text x="56.0" y="254.2" font-size="14.5" text-anchor="start" fill="#222222">assessment performed?</text>
<text x="56.0" y="285.5" font-size="13" text-anchor="start" font-weight="700" fill="#222222">no</text>
<path d="M82.4 280.5 L104.4 280.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="267.5" width="122.3" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="173.5" y="284.9" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">not_assessed</text>
<path d="M180.0 303.5 L180.0 328.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="321.1" font-size="13" text-anchor="start" fill="#57606a">yes</text>
<rect x="10.0" y="329.5" width="340.0" height="134.6" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="350.5" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="355.1" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="56.0" y="353.3" font-size="14.5" text-anchor="start" fill="#222222">May the reader&#x27;s</text>
<text x="56.0" y="372.4" font-size="14.5" text-anchor="start" fill="#222222">principal read the source?</text>
<text x="56.0" y="403.8" font-size="13" text-anchor="start" font-weight="700" fill="#222222">no</text>
<path d="M82.4 398.8 L104.4 398.8" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="385.8" width="111.3" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="168.0" y="403.2" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">inaccessible</text>
<text x="56.0" y="432.1" font-size="13" text-anchor="start" fill="#222222">reason and existence</text>
<text x="56.0" y="449.3" font-size="13" text-anchor="start" fill="#222222">disclosed only when permitted</text>
<path d="M180.0 464.1 L180.0 489.1" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="481.7" font-size="13" text-anchor="start" fill="#57606a">yes</text>
<rect x="10.0" y="490.1" width="340.0" height="117.4" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="511.1" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="515.7" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
<text x="56.0" y="513.9" font-size="14.5" text-anchor="start" fill="#222222">Did the source or</text>
<text x="56.0" y="533.0" font-size="14.5" text-anchor="start" fill="#222222">dependency answer?</text>
<text x="56.0" y="564.4" font-size="13" text-anchor="start" font-weight="700" fill="#222222">no</text>
<path d="M82.4 559.4 L104.4 559.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="546.4" width="107.0" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="165.9" y="563.8" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">unavailable</text>
<text x="56.0" y="592.8" font-size="13" text-anchor="start" fill="#222222">not the same as denied</text>
<path d="M180.0 607.6 L180.0 632.6" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="625.2" font-size="13" text-anchor="start" fill="#57606a">yes</text>
<rect x="10.0" y="633.6" width="340.0" height="115.5" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="654.6" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="659.2" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<text x="56.0" y="657.3" font-size="14.5" text-anchor="start" fill="#222222">Did a scoped retrieval complete?</text>
<text x="56.0" y="688.7" font-size="13" text-anchor="start" font-weight="700" fill="#222222">no</text>
<path d="M82.4 683.7 L104.4 683.7" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="670.7" width="79.0" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="151.9" y="688.1" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">missing</text>
<text x="56.0" y="717.0" font-size="13" text-anchor="start" fill="#222222">expected, not obtained;</text>
<text x="56.0" y="734.2" font-size="13" text-anchor="start" fill="#222222">reason may be unknown</text>
<path d="M180.0 749.0 L180.0 774.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="766.6" font-size="13" text-anchor="start" fill="#57606a">yes</text>
<rect x="10.0" y="775.0" width="340.0" height="134.6" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<circle cx="32.0" cy="796.0" r="12" fill="#6F6F6F" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="32.0" y="800.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
<text x="56.0" y="798.8" font-size="14.5" text-anchor="start" fill="#222222">Was absence observed, with method,</text>
<text x="56.0" y="817.9" font-size="14.5" text-anchor="start" fill="#222222">time and complete coverage?</text>
<text x="56.0" y="849.3" font-size="13" text-anchor="start" font-weight="700" fill="#222222">yes</text>
<path d="M89.1 844.3 L111.1 844.3" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="119.1" y="831.3" width="85.8" height="26.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="162.0" y="848.7" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">negative</text>
<text x="56.0" y="877.6" font-size="13" text-anchor="start" fill="#222222">an adequately scoped</text>
<text x="56.0" y="894.8" font-size="13" text-anchor="start" fill="#222222">observation of absence</text>
<path d="M180.0 909.6 L180.0 934.6" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="927.2" font-size="13" text-anchor="start" fill="#57606a">no</text>
<rect x="10.0" y="935.6" width="340.0" height="77.1" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<text x="20.0" y="959.6" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">not_retrieved</text>
<text x="20.0" y="980.7" font-size="13" text-anchor="start" fill="#3D2500">a completed retrieval found</text>
<text x="20.0" y="997.9" font-size="13" text-anchor="start" fill="#3D2500">nothing; not evidence of absence</text>
<text x="180.0" y="1042.9" font-size="15" text-anchor="middle" font-weight="700" fill="#1b1f24">Only negative is evidence of absence.</text>
<text x="180.0" y="1062.8" font-size="13" text-anchor="middle" fill="#57606a">Each of the other six labels says why nothing</text>
<text x="180.0" y="1080.0" font-size="13" text-anchor="middle" fill="#57606a">can be concluded from the missing input.</text>
</svg>
