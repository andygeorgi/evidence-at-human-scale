<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 712" width="1000" height="712" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Which missingness label applies?</title>
<desc id="d">A decision tree for an input that is not in front of the reader, read from the top. If a record is available but fails the freshness requirement, the label is stale. Otherwise, if the check or assessment was not performed, not assessed. Otherwise, if the reader&#x27;s principal may not read the source, inaccessible. Otherwise, if the source or dependency did not answer, unavailable. Otherwise, if no scoped retrieval completed, missing. Otherwise, if an adequately scoped observation of absence was made with method, time and complete coverage, negative; if not, not retrieved, which is not evidence of absence. Only negative is evidence of absence.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="1000" height="712" fill="#ffffff"/>
<rect x="24.0" y="14.0" width="470.0" height="40.0" rx="20" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<text x="259.0" y="40.0" font-size="15" text-anchor="middle" font-weight="700" fill="#222222">An expected input is not in front of the reader</text>
<path d="M259.0 54.0 L259.0 80.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="24.0" y="80.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="108.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="112.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="76.0" y="103.5" font-size="14.5" text-anchor="start" fill="#222222">A record is available but fails</text>
<text x="76.0" y="122.5" font-size="14.5" text-anchor="start" fill="#222222">the freshness requirement?</text>
<path d="M494.0 108.0 L590.0 108.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="101.0" font-size="12.5" text-anchor="middle" fill="#57606a">yes</text>
<rect x="590.0" y="80.0" width="386.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="783.0" y="102.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">stale</text>
<text x="783.0" y="124.4" font-size="12.5" text-anchor="middle" fill="#3D2500">a record exists but fails the freshness requirement</text>
<path d="M259.0 136.0 L259.0 164.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="154.5" font-size="12.5" text-anchor="start" fill="#57606a">no</text>
<rect x="24.0" y="164.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="192.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="196.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="76.0" y="197.0" font-size="14.5" text-anchor="start" fill="#222222">Was the check or assessment performed?</text>
<path d="M494.0 192.0 L590.0 192.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="185.0" font-size="12.5" text-anchor="middle" fill="#57606a">no</text>
<rect x="590.0" y="164.0" width="386.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="783.0" y="186.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">not_assessed</text>
<text x="783.0" y="208.4" font-size="12.5" text-anchor="middle" fill="#3D2500">the check or assessment was not performed</text>
<path d="M259.0 220.0 L259.0 248.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="238.5" font-size="12.5" text-anchor="start" fill="#57606a">yes</text>
<rect x="24.0" y="248.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="276.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="280.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="76.0" y="281.0" font-size="14.5" text-anchor="start" fill="#222222">May the reader&#x27;s principal read the source?</text>
<path d="M494.0 276.0 L590.0 276.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="269.0" font-size="12.5" text-anchor="middle" fill="#57606a">no</text>
<rect x="590.0" y="248.0" width="386.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="783.0" y="270.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">inaccessible</text>
<text x="783.0" y="292.4" font-size="12.5" text-anchor="middle" fill="#3D2500">reason and existence disclosed only when permitted</text>
<path d="M259.0 304.0 L259.0 332.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="322.5" font-size="12.5" text-anchor="start" fill="#57606a">yes</text>
<rect x="24.0" y="332.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="360.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="364.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="76.0" y="365.0" font-size="14.5" text-anchor="start" fill="#222222">Did the source or dependency answer?</text>
<path d="M494.0 360.0 L590.0 360.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="353.0" font-size="12.5" text-anchor="middle" fill="#57606a">no</text>
<rect x="590.0" y="332.0" width="386.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="783.0" y="354.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">unavailable</text>
<text x="783.0" y="376.4" font-size="12.5" text-anchor="middle" fill="#3D2500">not the same as denied</text>
<path d="M259.0 388.0 L259.0 416.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="406.5" font-size="12.5" text-anchor="start" fill="#57606a">yes</text>
<rect x="24.0" y="416.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="444.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="448.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="76.0" y="449.0" font-size="14.5" text-anchor="start" fill="#222222">Did a scoped retrieval complete?</text>
<path d="M494.0 444.0 L590.0 444.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="437.0" font-size="12.5" text-anchor="middle" fill="#57606a">no</text>
<rect x="590.0" y="416.0" width="386.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="783.0" y="438.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">missing</text>
<text x="783.0" y="460.4" font-size="12.5" text-anchor="middle" fill="#3D2500">expected, not obtained; reason may be unknown</text>
<path d="M259.0 472.0 L259.0 500.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="490.5" font-size="12.5" text-anchor="start" fill="#57606a">yes</text>
<rect x="24.0" y="500.0" width="470.0" height="56.0" rx="8" fill="#F4F4F4" stroke="#777777" stroke-width="1.6"/>
<circle cx="50.0" cy="528.0" r="12" fill="#777777" stroke="#777777" stroke-width="1.6"/>
<text x="50.0" y="532.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
<text x="76.0" y="523.5" font-size="14.5" text-anchor="start" fill="#222222">Was absence observed, with method,</text>
<text x="76.0" y="542.5" font-size="14.5" text-anchor="start" fill="#222222">time and complete coverage?</text>
<path d="M494.0 528.0 L590.0 528.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="542.0" y="521.0" font-size="12.5" text-anchor="middle" fill="#57606a">yes</text>
<rect x="590.0" y="500.0" width="386.0" height="56.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="783.0" y="522.7" font-size="15" text-anchor="middle" font-weight="700" fill="#0F2E1B">negative</text>
<text x="783.0" y="544.4" font-size="12.5" text-anchor="middle" fill="#0F2E1B">an adequately scoped observation of absence</text>
<path d="M259.0 556.0 L259.0 584.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="275.0" y="574.5" font-size="12.5" text-anchor="start" fill="#57606a">no</text>
<rect x="24.0" y="584.0" width="470.0" height="56.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="259.0" y="606.7" font-size="15" text-anchor="middle" font-weight="700" fill="#3D2500">not_retrieved</text>
<text x="259.0" y="628.4" font-size="12.5" text-anchor="middle" fill="#3D2500">a completed retrieval found nothing; not evidence of absence</text>
<text x="500.0" y="676.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1b1f24">Only negative is evidence of absence.</text>
<text x="500.0" y="696.0" font-size="12.5" text-anchor="middle" fill="#57606a">Each of the other six labels says why nothing can be concluded from the missing input.</text>
</svg>
