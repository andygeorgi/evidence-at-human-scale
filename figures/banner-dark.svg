<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Evidence at Human Scale: systems produce evidence, AI makes it consumable, people remain accountable</title>
<desc id="d">A banner in three parts. Systems produce evidence: typed records with versions and lineage. AI makes it consumable: a decision packet that separates claims from labelled inferences and shows conflicts, gaps and unexecuted proposals. People remain accountable: a person approves an exact proposal or holds it. Evidence is not inference, not recommendation, and not authority.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="1280" height="420" fill="#0d1117"/>
<text x="640.0" y="50.0" font-size="36" text-anchor="middle" font-weight="700" fill="#e6edf3">Evidence at Human Scale</text>
<text x="640.0" y="82.0" font-size="18" text-anchor="middle" fill="#9da7b3">Reference architecture for accountable decisions in agentic systems</text>
<rect x="40.0" y="112.0" width="360.0" height="238.0" rx="14" fill="#12304F" stroke="#58A6FF" stroke-width="2"/>
<text x="220.0" y="146.0" font-size="21" text-anchor="middle" font-weight="700" fill="#CDE4FF">Systems produce evidence</text>
<rect x="460.0" y="112.0" width="360.0" height="238.0" rx="14" fill="#12361F" stroke="#56D364" stroke-width="2"/>
<text x="640.0" y="146.0" font-size="21" text-anchor="middle" font-weight="700" fill="#D2F8DB">AI makes it consumable</text>
<rect x="880.0" y="112.0" width="360.0" height="238.0" rx="14" fill="#2D2150" stroke="#A371F7" stroke-width="2"/>
<text x="1060.0" y="146.0" font-size="21" text-anchor="middle" font-weight="700" fill="#E6DAFF">People remain accountable</text>
<rect x="70.0" y="166.0" width="300.0" height="44.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="86.0" y="194.0" font-size="16" text-anchor="start" font-weight="700" fill="#CDE4FF">S01/v1</text>
<text x="170.0" y="194.0" font-size="15" text-anchor="start" fill="#CDE4FF">source record</text>
<rect x="70.0" y="218.0" width="300.0" height="44.0" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="86.0" y="246.0" font-size="16" text-anchor="start" font-weight="700" fill="#CFF6F9">F01/v1</text>
<text x="170.0" y="246.0" font-size="15" text-anchor="start" fill="#CFF6F9">deterministic finding</text>
<rect x="70.0" y="270.0" width="300.0" height="44.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="86.0" y="298.0" font-size="16" text-anchor="start" font-weight="700" fill="#FFEBC2">M01/v1</text>
<text x="170.0" y="298.0" font-size="15" text-anchor="start" fill="#FFEBC2">model inference</text>
<text x="220.0" y="334.0" font-size="13" text-anchor="middle" fill="#9da7b3">typed · versioned · with lineage</text>
<rect x="490.0" y="166.0" width="300.0" height="168.0" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<rect x="500.0" y="176.0" width="280.0" height="30.0" rx="6" fill="#12361F" stroke="#56D364" stroke-width="1.2"/>
<text x="510.0" y="196.0" font-size="14" text-anchor="start" font-weight="700" fill="#D2F8DB">Claims</text>
<text x="770.0" y="196.0" font-size="12.5" text-anchor="end" fill="#D2F8DB">each cites its evidence</text>
<rect x="500.0" y="214.0" width="280.0" height="30.0" rx="6" fill="#4A3200" stroke="#E3B341" stroke-width="1.2"/>
<text x="510.0" y="234.0" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">Inferences</text>
<text x="770.0" y="234.0" font-size="12.5" text-anchor="end" fill="#FFEBC2">labelled, never claims</text>
<rect x="500.0" y="252.0" width="280.0" height="30.0" rx="6" fill="#4D1511" stroke="#F85149" stroke-width="1.2"/>
<text x="510.0" y="272.0" font-size="14" text-anchor="start" font-weight="700" fill="#FFD8D3">Conflicts · gaps</text>
<text x="770.0" y="272.0" font-size="12.5" text-anchor="end" fill="#FFD8D3">stay visible</text>
<rect x="500.0" y="290.0" width="280.0" height="30.0" rx="6" fill="#2D2150" stroke="#A371F7" stroke-width="1.2"/>
<text x="510.0" y="310.0" font-size="14" text-anchor="start" font-weight="700" fill="#E6DAFF">Proposals</text>
<text x="770.0" y="310.0" font-size="12.5" text-anchor="end" fill="#E6DAFF">not executed</text>
<circle cx="1060" cy="186" r="15" fill="#2D2150" stroke="#A371F7" stroke-width="2"/>
<path d="M1030 232 q0 -30 30 -30 q30 0 30 30 z" fill="#2D2150" stroke="#A371F7" stroke-width="2"/>
<rect x="910.0" y="252.0" width="140.0" height="44.0" rx="22" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="980.0" y="280.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#D2F8DB">Approve exactly</text>
<rect x="1070.0" y="252.0" width="140.0" height="44.0" rx="22" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="1140.0" y="280.0" font-size="14.5" text-anchor="middle" font-weight="700" fill="#FFEBC2">Hold</text>
<text x="1060.0" y="326.0" font-size="13" text-anchor="middle" fill="#9da7b3">one exact proposal, current checks at commit</text>
<path d="M400.0 232.0 L458.0 232.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M820.0 232.0 L878.0 232.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40.0" y="366.0" width="1200.0" height="40.0" rx="10" fill="#21262D" stroke="#8b949e" stroke-width="1.2"/>
<text x="640.0" y="393.0" font-size="18" text-anchor="middle" font-weight="700" fill="#e6edf3">evidence  ≠  inference  ≠  recommendation  ≠  authority</text>
</svg>
