<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 738" width="1000" height="738" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Reference architecture: a main path of nine steps and two separate paths</title>
<desc id="d">The main path runs from sources through admission, a registry of immutable versions, authorized retrieval, relevance and coverage, a selection manifest, bounded synthesis and release validation to review of one decision packet by the Decision Owner. A separate mandatory continuity path runs from the registry through deterministic detection and an authorized notification queue to acknowledgement or escalation. A separate action path runs from an exact approved proposal or bounded grant through an executor with current checks to an authoritative target and a verified receipt. Corrections, revocations, late evidence and challenges return to reassessment and invalidation. A control plane constrains every stage.</desc>
