<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1632" width="360" height="1632" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Reference architecture</title>
<desc id="d">Nine numbered steps run from sources to the review of one decision packet. A separate mandatory continuity path branches from the registry. A separate action path starts at the review. A reassessment and invalidation step receives corrections and outcomes and returns to the registry. A control plane constrains every stage and path.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="360" height="1632" fill="#ffffff"/>
<rect x="10.0" y="10.0" width="340.0" height="721.4" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="34.4" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">MAIN PATH</text>
<text x="24.0" y="53.5" font-size="13" text-anchor="start" fill="#57606a">nine steps to one review contract</text>
<rect x="52.0" y="66.3" width="288.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="62.0" y="90.3" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Sources</text>
<text x="62.0" y="111.4" font-size="13" text-anchor="start" fill="#0B2540">records, events, services, analytics</text>
<circle cx="32.0" cy="87.3" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="91.9" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<rect x="52.0" y="136.2" width="288.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="62.0" y="160.2" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Admission</text>
<text x="62.0" y="181.3" font-size="13" text-anchor="start" fill="#0B2540">registered producer, permitted kind</text>
<circle cx="32.0" cy="157.2" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="161.8" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<path d="M32.0 100.3 L32.0 144.2" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="206.1" width="288.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="62.0" y="230.1" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Registry (C02)</text>
<text x="62.0" y="251.2" font-size="13" text-anchor="start" fill="#0B2540">admitted immutable versions</text>
<circle cx="32.0" cy="227.1" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="231.7" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<path d="M32.0 170.2 L32.0 214.1" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="276.0" width="288.0" height="78.7" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="62.0" y="300.0" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">Authorized retrieval</text>
<text x="62.0" y="318.7" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">(context C01)</text>
<text x="62.0" y="339.9" font-size="13" text-anchor="start" fill="#06323A">candidate evidence and coverage</text>
<circle cx="32.0" cy="297.0" r="12" fill="#1E7F8C" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="301.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">4</text>
<path d="M32.0 240.1 L32.0 284.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="364.7" width="288.0" height="59.9" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="62.0" y="388.7" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">Relevance and coverage</text>
<text x="62.0" y="409.8" font-size="13" text-anchor="start" fill="#06323A">priority, grouping, exclusions</text>
<circle cx="32.0" cy="385.7" r="12" fill="#1E7F8C" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="390.3" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<path d="M32.0 310.0 L32.0 372.7" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="434.6" width="288.0" height="59.9" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="62.0" y="458.6" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">Selection manifest (C03)</text>
<text x="62.0" y="479.7" font-size="13" text-anchor="start" fill="#06323A">retrieved, kept, excluded, missing</text>
<circle cx="32.0" cy="455.6" r="12" fill="#1E7F8C" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="460.2" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
<path d="M32.0 398.7 L32.0 442.6" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="504.5" width="288.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="62.0" y="528.5" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">Bounded synthesis</text>
<text x="62.0" y="549.6" font-size="13" text-anchor="start" fill="#0F2E1B">candidate decision packet</text>
<circle cx="32.0" cy="525.5" r="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="530.1" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">7</text>
<path d="M32.0 468.6 L32.0 512.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="574.4" width="288.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="62.0" y="598.4" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">Release validation</text>
<text x="62.0" y="619.5" font-size="13" text-anchor="start" fill="#0F2E1B">claim, reference, disclosure checks</text>
<circle cx="32.0" cy="595.4" r="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="600.0" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">8</text>
<path d="M32.0 538.5 L32.0 582.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="52.0" y="644.3" width="288.0" height="77.1" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="62.0" y="668.3" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">Review of the packet (C04)</text>
<text x="62.0" y="689.4" font-size="13" text-anchor="start" fill="#24133F">the Decision Owner</text>
<text x="62.0" y="706.6" font-size="13" text-anchor="start" fill="#24133F">inspects and challenges</text>
<circle cx="32.0" cy="665.3" r="12" fill="#6A4BA1" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="32.0" y="669.9" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">9</text>
<path d="M32.0 608.4 L32.0 652.3" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="747.4" width="340.0" height="227.7" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="771.8" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">MANDATORY CONTINUITY PATH</text>
<text x="24.0" y="790.9" font-size="13" text-anchor="start" fill="#57606a">branches from step 3 · no LLM dependency</text>
<rect x="22.0" y="803.7" width="316.0" height="38.8" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="827.7" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Deterministic detection</text>
<path d="M180.0 842.5 L180.0 857.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="858.5" width="316.0" height="38.8" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="882.4" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Authorized notification and queue</text>
<path d="M180.0 897.2 L180.0 912.2" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="913.2" width="316.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="937.2" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Acknowledgement or escalation</text>
<text x="32.0" y="958.3" font-size="13" text-anchor="start" fill="#0B2540">receipt, not resolution</text>
<rect x="10.0" y="991.1" width="340.0" height="338.0" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="1015.5" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">ACTION PATH</text>
<text x="24.0" y="1034.7" font-size="13" text-anchor="start" fill="#57606a">starts at step 9, the review</text>
<rect x="22.0" y="1047.5" width="316.0" height="77.1" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="32.0" y="1071.4" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">Approval or grant (C06)</text>
<text x="32.0" y="1092.6" font-size="13" text-anchor="start" fill="#24133F">an exact approval of one proposal</text>
<text x="32.0" y="1109.7" font-size="13" text-anchor="start" fill="#24133F">(C05), or a bounded grant</text>
<path d="M180.0 1124.5 L180.0 1139.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1140.5" width="316.0" height="77.1" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<text x="32.0" y="1164.5" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">Executor (action gateway)</text>
<text x="32.0" y="1185.6" font-size="13" text-anchor="start" fill="#3D2500">rechecks at commit: grant,</text>
<text x="32.0" y="1202.8" font-size="13" text-anchor="start" fill="#3D2500">evidence, preconditions, limits</text>
<path d="M180.0 1217.6 L180.0 1232.6" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1233.6" width="316.0" height="38.8" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="1257.6" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Authoritative target</text>
<path d="M180.0 1272.4 L180.0 1287.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="22.0" y="1288.4" width="316.0" height="38.8" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="1312.3" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">Verified receipt (C07)</text>
<path d="M180.0 1329.1 L180.0 1358.1" fill="none" stroke="#57606a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="190.0" y="1348.7" font-size="13" text-anchor="start" fill="#57606a">outcome</text>
<rect x="10.0" y="1359.1" width="340.0" height="128.6" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="20.0" y="1383.1" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">Reassessment and invalidation</text>
<text x="20.0" y="1404.2" font-size="13" text-anchor="start" fill="#3D2500">Corrections, revocations, late evidence,</text>
<text x="20.0" y="1421.4" font-size="13" text-anchor="start" fill="#3D2500">challenges and verified outcomes arrive</text>
<text x="20.0" y="1438.5" font-size="13" text-anchor="start" fill="#3D2500">here. This step returns to the registry</text>
<text x="20.0" y="1455.7" font-size="13" text-anchor="start" fill="#3D2500">(step 3): affected derivatives, packets</text>
<text x="20.0" y="1472.8" font-size="13" text-anchor="start" fill="#3D2500">and pending approvals stop being current.</text>
<rect x="10.0" y="1503.7" width="340.0" height="117.8" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="1528.0" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">CONTROL PLANE</text>
<text x="24.0" y="1547.2" font-size="13" text-anchor="start" fill="#57606a">constrains every stage and path</text>
<text x="24.0" y="1573.3" font-size="14" text-anchor="start" fill="#1b1f24">identity · authorization · purpose</text>
<text x="24.0" y="1591.8" font-size="14" text-anchor="start" fill="#1b1f24">domain policy · inventory · freshness</text>
<text x="24.0" y="1610.2" font-size="14" text-anchor="start" fill="#1b1f24">budgets · delegation</text>
</svg>
