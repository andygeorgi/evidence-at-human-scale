<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomy of a decision packet</title>
<desc id="d">The Decision Owner reviews one decision packet bound to an exact context, selection and as-of time. Its supported claims, labeled inferences and conflicts point to exact evidence records. Its coverage, omissions and obligations come from the selection manifest. Its action proposals are proposed, not executed, and point to action proposal records.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="1000" height="690" fill="#0d1117"/>
<rect x="16.0" y="290.0" width="150.0" height="80.0" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="91.0" y="316.4" font-size="15" text-anchor="middle" font-weight="700" fill="#E6DAFF">Decision Owner</text>
<text x="91.0" y="338.2" font-size="12.5" text-anchor="middle" fill="#E6DAFF">reviews,</text>
<text x="91.0" y="354.7" font-size="12.5" text-anchor="middle" fill="#E6DAFF">challenges, decides</text>
<path d="M166.0 330.0 L206.0 330.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="206.0" y="12.0" width="454.0" height="666.0" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="220.0" y="34.0" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">DECISION PACKET (C04) · one context, selection, as-of (G01)</text>
<rect x="222.0" y="46.0" width="422.0" height="66.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="433.0" y="73.7" font-size="15" text-anchor="middle" font-weight="700" fill="#D2F8DB">G02 Supported claims</text>
<text x="433.0" y="95.4" font-size="12.5" text-anchor="middle" fill="#D2F8DB">each cites an exact record version</text>
<rect x="222.0" y="124.0" width="422.0" height="66.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="433.0" y="151.7" font-size="15" text-anchor="middle" font-weight="700" fill="#FFEBC2">G03 Labeled inferences</text>
<text x="433.0" y="173.4" font-size="12.5" text-anchor="middle" fill="#FFEBC2">method and limits; never claims</text>
<rect x="222.0" y="202.0" width="422.0" height="66.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="433.0" y="229.7" font-size="15" text-anchor="middle" font-weight="700" fill="#D2F8DB">G04 Recommendations</text>
<text x="433.0" y="251.4" font-size="12.5" text-anchor="middle" fill="#D2F8DB">with the accountable review requirement</text>
<rect x="222.0" y="280.0" width="422.0" height="66.0" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="433.0" y="307.7" font-size="15" text-anchor="middle" font-weight="700" fill="#FFD8D3">G05 Conflicts and uncertainty</text>
<text x="433.0" y="329.4" font-size="12.5" text-anchor="middle" fill="#FFD8D3">visible, never settled by majority</text>
<rect x="222.0" y="358.0" width="422.0" height="66.0" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="433.0" y="385.7" font-size="15" text-anchor="middle" font-weight="700" fill="#FFD8D3">G06 Coverage, omissions, gaps</text>
<text x="433.0" y="407.4" font-size="12.5" text-anchor="middle" fill="#FFD8D3">seven missingness labels</text>
<rect x="222.0" y="436.0" width="422.0" height="66.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="433.0" y="463.7" font-size="15" text-anchor="middle" font-weight="700" fill="#D2F8DB">G07 Obligations</text>
<text x="433.0" y="485.4" font-size="12.5" text-anchor="middle" fill="#D2F8DB">priority and mandatory items</text>
<rect x="222.0" y="514.0" width="422.0" height="66.0" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="433.0" y="541.7" font-size="15" text-anchor="middle" font-weight="700" fill="#E6DAFF">G08 Action proposals</text>
<text x="433.0" y="563.4" font-size="12.5" text-anchor="middle" fill="#E6DAFF">proposed, not executed</text>
<rect x="222.0" y="592.0" width="422.0" height="66.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="433.0" y="619.7" font-size="15" text-anchor="middle" font-weight="700" fill="#D2F8DB">G09 Review and version history</text>
<text x="433.0" y="641.4" font-size="12.5" text-anchor="middle" fill="#D2F8DB">revised versions stay distinguishable</text>
<rect x="704.0" y="46.0" width="280.0" height="300.0" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="844.0" y="174.2" font-size="15" text-anchor="middle" font-weight="700" fill="#CDE4FF">Evidence records (C02)</text>
<text x="844.0" y="195.9" font-size="12.5" text-anchor="middle" fill="#CDE4FF">exact version, claim or payload</text>
<text x="844.0" y="212.4" font-size="12.5" text-anchor="middle" fill="#CDE4FF">pointer, original locator, scope,</text>
<text x="844.0" y="228.9" font-size="12.5" text-anchor="middle" fill="#CDE4FF">method, lifecycle</text>
<rect x="704.0" y="358.0" width="280.0" height="144.0" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="844.0" y="416.4" font-size="15" text-anchor="middle" font-weight="700" fill="#CFF6F9">Selection manifest (C03)</text>
<text x="844.0" y="438.2" font-size="12.5" text-anchor="middle" fill="#CFF6F9">what was retrieved, kept,</text>
<text x="844.0" y="454.7" font-size="12.5" text-anchor="middle" fill="#CFF6F9">excluded and missing</text>
<rect x="704.0" y="514.0" width="280.0" height="66.0" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="844.0" y="541.7" font-size="15" text-anchor="middle" font-weight="700" fill="#E6DAFF">Action proposals (C05)</text>
<text x="844.0" y="563.4" font-size="12.5" text-anchor="middle" fill="#E6DAFF">evidence, preconditions, accounting</text>
<path d="M644.0 79.0 L704.0 79.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M644.0 157.0 L704.0 157.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M644.0 313.0 L704.0 313.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M644.0 391.0 L704.0 391.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M644.0 469.0 L704.0 469.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M644.0 547.0 L704.0 547.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
