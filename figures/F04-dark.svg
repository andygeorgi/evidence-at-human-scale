<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1185" width="360" height="1185" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomy of a decision packet</title>
<desc id="d">The Decision Owner reviews a decision packet (C04) of nine groups. Tags show that the groups for claims, inferences and conflicts point to evidence records (C02), the groups for coverage and obligations to the selection manifest (C03), and the group for action proposals to action proposal records (C05). A band below names the three contracts that the tags point to.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="1185" fill="#0d1117"/>
<rect x="80.0" y="10.0" width="200.0" height="77.1" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="180.0" y="34.0" font-size="15" text-anchor="middle" font-weight="700" fill="#E6DAFF">Decision Owner</text>
<text x="180.0" y="55.1" font-size="13" text-anchor="middle" fill="#E6DAFF">reviews,</text>
<text x="180.0" y="72.3" font-size="13" text-anchor="middle" fill="#E6DAFF">challenges, decides</text>
<path d="M180.0 87.1 L180.0 110.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="111.1" width="340.0" height="741.3" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="135.4" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">DECISION PACKET (C04)</text>
<text x="24.0" y="154.6" font-size="13" text-anchor="start" fill="#9da7b3">nine groups; a tag names</text>
<text x="24.0" y="171.7" font-size="13" text-anchor="start" fill="#9da7b3">what a group points to</text>
<rect x="22.0" y="184.5" width="316.0" height="77.1" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="208.5" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Context and as-of time</text>
<text x="32.0" y="229.6" font-size="13" text-anchor="start" fill="#D2F8DB">one context, selection and as-of time;</text>
<text x="32.0" y="246.8" font-size="13" text-anchor="start" fill="#D2F8DB">everything below is bound to them</text>
<rect x="22.0" y="269.6" width="316.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="246.5" y="277.6" width="81.5" height="23.0" rx="11.5" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="287.2" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">evidence</text>
<text x="32.0" y="293.6" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Supported claims</text>
<text x="32.0" y="314.7" font-size="13" text-anchor="start" fill="#D2F8DB">each cites an exact record version</text>
<rect x="22.0" y="337.5" width="316.0" height="59.9" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<rect x="246.5" y="345.5" width="81.5" height="23.0" rx="11.5" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="287.2" y="361.4" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">evidence</text>
<text x="32.0" y="361.5" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Labeled inferences</text>
<text x="32.0" y="382.6" font-size="13" text-anchor="start" fill="#FFEBC2">method and limits; never claims</text>
<rect x="22.0" y="405.4" width="316.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="429.4" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Recommendations</text>
<text x="32.0" y="450.5" font-size="13" text-anchor="start" fill="#D2F8DB">with the accountable review requirement</text>
<rect x="22.0" y="473.3" width="316.0" height="78.7" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<rect x="246.5" y="481.3" width="81.5" height="23.0" rx="11.5" fill="#12304F" stroke="#58A6FF" stroke-width="1.4"/>
<text x="287.2" y="497.3" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">evidence</text>
<text x="32.0" y="497.3" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">Conflicts and</text>
<text x="32.0" y="516.0" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">uncertainty</text>
<text x="32.0" y="537.2" font-size="13" text-anchor="start" fill="#FFD8D3">visible, never settled by majority</text>
<rect x="22.0" y="560.0" width="316.0" height="78.7" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<rect x="245.7" y="568.0" width="82.3" height="23.0" rx="11.5" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.4"/>
<text x="286.8" y="583.9" font-size="13" text-anchor="middle" font-weight="700" fill="#CFF6F9">selection</text>
<text x="32.0" y="584.0" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Coverage,</text>
<text x="32.0" y="602.7" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">omissions, gaps</text>
<text x="32.0" y="623.9" font-size="13" text-anchor="start" fill="#FFEBC2">seven missingness labels</text>
<rect x="22.0" y="646.7" width="316.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="245.7" y="654.7" width="82.3" height="23.0" rx="11.5" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.4"/>
<text x="286.8" y="670.6" font-size="13" text-anchor="middle" font-weight="700" fill="#CFF6F9">selection</text>
<text x="32.0" y="670.6" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Obligations</text>
<text x="32.0" y="691.8" font-size="13" text-anchor="start" fill="#D2F8DB">priority and mandatory items</text>
<rect x="22.0" y="714.6" width="316.0" height="59.9" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<rect x="248.0" y="722.6" width="80.0" height="23.0" rx="11.5" fill="#2D2150" stroke="#A371F7" stroke-width="1.4"/>
<text x="288.0" y="738.5" font-size="13" text-anchor="middle" font-weight="700" fill="#E6DAFF">proposal</text>
<text x="32.0" y="738.5" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Action proposals</text>
<text x="32.0" y="759.7" font-size="13" text-anchor="start" fill="#E6DAFF">proposed, not executed</text>
<rect x="22.0" y="782.5" width="316.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="806.4" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Review and version history</text>
<text x="32.0" y="827.6" font-size="13" text-anchor="start" fill="#D2F8DB">revised versions stay distinguishable</text>
<path d="M180.0 852.4 L180.0 879.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="871.0" font-size="13" text-anchor="start" fill="#9da7b3">tags point to</text>
<rect x="10.0" y="880.4" width="340.0" height="294.4" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="904.7" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">WHAT THE TAGS POINT TO</text>
<rect x="22.0" y="917.6" width="316.0" height="77.1" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="941.5" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Evidence record (C02)</text>
<text x="32.0" y="962.7" font-size="13" text-anchor="start" fill="#CDE4FF">by exact version, claim or payload pointer,</text>
<text x="32.0" y="979.8" font-size="13" text-anchor="start" fill="#CDE4FF">original locator, scope, method, lifecycle</text>
<rect x="22.0" y="1002.6" width="316.0" height="77.1" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="1026.6" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Selection manifest (C03)</text>
<text x="32.0" y="1047.7" font-size="13" text-anchor="start" fill="#CFF6F9">what was retrieved, kept,</text>
<text x="32.0" y="1064.9" font-size="13" text-anchor="start" fill="#CFF6F9">excluded and missing</text>
<rect x="22.0" y="1087.7" width="316.0" height="77.1" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="32.0" y="1111.6" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Action proposal (C05)</text>
<text x="32.0" y="1132.8" font-size="13" text-anchor="start" fill="#E6DAFF">records with evidence,</text>
<text x="32.0" y="1150.0" font-size="13" text-anchor="start" fill="#E6DAFF">preconditions, accounting</text>
</svg>
