<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 897" width="360" height="897" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">A late correction reaches a pending approval</title>
<desc id="d">A vertical timeline in which a correction is admitted, supersedes the earlier record and invalidates what was derived from it; the packet is invalidated, a revised packet is produced and the pending approval is revoked; the queued action is then refused by the executor (action gateway) and a not_executed_verified receipt records why.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="897" fill="#0d1117"/>
<text x="42.0" y="26.0" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">BEFORE</text>
<rect x="42.0" y="40.0" width="308.0" height="78.7" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="52.0" y="64.0" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Packet (C04) and</text>
<text x="52.0" y="82.7" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">delegation (C06)</text>
<text x="52.0" y="103.8" font-size="13" text-anchor="start" fill="#E6DAFF">An approval is queued for a later run.</text>
<circle cx="20.0" cy="61.0" r="6" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="42.0" y="152.7" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">THE CORRECTION CASCADES</text>
<rect x="42.0" y="166.7" width="308.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="52.0" y="190.6" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Source owner</text>
<text x="52.0" y="211.8" font-size="13" text-anchor="start" fill="#CDE4FF">A correction is admitted as a new version.</text>
<path d="M20.0 67.0 L20.0 181.7" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="187.7" r="6" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<rect x="42.0" y="238.6" width="308.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="52.0" y="262.5" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Registry (C02)</text>
<text x="52.0" y="283.7" font-size="13" text-anchor="start" fill="#CDE4FF">It supersedes the earlier version.</text>
<path d="M20.0 193.7 L20.0 253.6" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="259.6" r="6" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<rect x="42.0" y="310.5" width="308.0" height="94.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="52.0" y="334.4" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Lineage</text>
<text x="52.0" y="355.6" font-size="13" text-anchor="start" fill="#CDE4FF">Findings and summaries derived from</text>
<text x="52.0" y="372.7" font-size="13" text-anchor="start" fill="#CDE4FF">the earlier version are invalidated, and</text>
<text x="52.0" y="389.9" font-size="13" text-anchor="start" fill="#CDE4FF">so is the packet that rested on them.</text>
<path d="M20.0 265.6 L20.0 325.5" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="331.5" r="6" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<rect x="42.0" y="416.7" width="308.0" height="77.1" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="52.0" y="440.7" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Packet (C04)</text>
<text x="52.0" y="461.8" font-size="13" text-anchor="start" fill="#D2F8DB">A revised packet is produced;</text>
<text x="52.0" y="479.0" font-size="13" text-anchor="start" fill="#D2F8DB">the prior version stays linked.</text>
<path d="M20.0 337.5 L20.0 431.7" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="437.7" r="6" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="42.0" y="505.8" width="308.0" height="59.9" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="52.0" y="529.7" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Delegation (C06)</text>
<text x="52.0" y="550.9" font-size="13" text-anchor="start" fill="#E6DAFF">The pending approval is revoked.</text>
<path d="M20.0 443.7 L20.0 520.8" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="526.8" r="6" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="42.0" y="599.7" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">AT COMMIT</text>
<rect x="42.0" y="613.7" width="308.0" height="94.2" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="52.0" y="637.6" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Executor (action gateway)</text>
<text x="52.0" y="658.8" font-size="13" text-anchor="start" fill="#FFEBC2">The queued action reaches commit</text>
<text x="52.0" y="676.0" font-size="13" text-anchor="start" fill="#FFEBC2">and is rechecked: the grant is revoked</text>
<text x="52.0" y="693.1" font-size="13" text-anchor="start" fill="#FFEBC2">and the evidence is no longer current.</text>
<path d="M20.0 532.8 L20.0 628.7" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="634.7" r="6" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<rect x="42.0" y="719.9" width="308.0" height="77.1" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="52.0" y="743.9" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Receipt (C07)</text>
<text x="52.0" y="765.0" font-size="13" text-anchor="start" fill="#D2F8DB">Refused: the state is</text>
<text x="52.0" y="782.2" font-size="13" text-anchor="start" fill="#D2F8DB">not_executed_verified, with the reasons.</text>
<path d="M20.0 640.7 L20.0 734.9" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="740.9" r="6" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<rect x="42.0" y="809.0" width="308.0" height="77.1" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="52.0" y="832.9" font-size="15" text-anchor="start" font-weight="700" fill="#e6edf3">Next</text>
<text x="52.0" y="854.1" font-size="13" text-anchor="start" fill="#e6edf3">A new proposal on the revised</text>
<text x="52.0" y="871.2" font-size="13" text-anchor="start" fill="#e6edf3">packet needs a new approval.</text>
<path d="M20.0 746.9 L20.0 824.0" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<circle cx="20.0" cy="830.0" r="6" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
</svg>
