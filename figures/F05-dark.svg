<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1017" width="360" height="1017" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">From proposal to commit</title>
<desc id="d">A packet lists a proposal. An approver, a role distinct from the requestor, approves the exact proposal version, or a bounded grant covers it. A divider reads Approval is not commit. At commit, the executor rechecks six conditions. If all pass, it reserves allowance and submits. If one fails, the action is rejected before submission; that alone is not proof of no effect. A check of the target confirms the outcome.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="1017" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="59.9" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="20.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">The packet lists the proposal</text>
<text x="20.0" y="55.1" font-size="13" text-anchor="start" fill="#E6DAFF">proposed, not executed</text>
<rect x="10.0" y="93.9" width="153.0" height="147.3" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="20.0" y="117.9" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Exact approval</text>
<text x="20.0" y="136.6" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">(C06)</text>
<text x="20.0" y="157.8" font-size="13" text-anchor="start" fill="#E6DAFF">of this proposal</text>
<text x="20.0" y="174.9" font-size="13" text-anchor="start" fill="#E6DAFF">version, by the</text>
<text x="20.0" y="192.1" font-size="13" text-anchor="start" fill="#E6DAFF">approver, a role</text>
<text x="20.0" y="209.2" font-size="13" text-anchor="start" fill="#E6DAFF">distinct from</text>
<text x="20.0" y="226.4" font-size="13" text-anchor="start" fill="#E6DAFF">the requestor</text>
<rect x="197.0" y="93.9" width="153.0" height="147.3" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="207.0" y="117.9" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Bounded</text>
<text x="207.0" y="136.6" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">grant (C06)</text>
<text x="207.0" y="157.8" font-size="13" text-anchor="start" fill="#E6DAFF">a grant for a class</text>
<text x="207.0" y="174.9" font-size="13" text-anchor="start" fill="#E6DAFF">of actions already</text>
<text x="207.0" y="192.1" font-size="13" text-anchor="start" fill="#E6DAFF">covers the proposal</text>
<path d="M180.0 69.9 L180.0 81.9" fill="none" stroke="#8b949e" stroke-width="1.8"/>
<path d="M180.0 81.9 L86.5 81.9 L86.5 92.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M180.0 81.9 L273.5 81.9 L273.5 92.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="180.0" y="172.2" font-size="13" text-anchor="middle" font-weight="700" fill="#9da7b3">or</text>
<path d="M10.0 277.2 L350.0 277.2" fill="none" stroke="#8b949e" stroke-width="1.4"/>
<rect x="67.3" y="262.2" width="225.4" height="30.0" rx="15" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="180.0" y="282.7" font-size="15" text-anchor="middle" font-weight="700" fill="#FFEBC2">Approval is not commit</text>
<rect x="10.0" y="307.2" width="340.0" height="250.8" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="331.6" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">RECHECK AT COMMIT</text>
<text x="24.0" y="350.7" font-size="13" text-anchor="start" fill="#9da7b3">the executor, or action gateway,</text>
<text x="24.0" y="367.9" font-size="13" text-anchor="start" fill="#9da7b3">checks the current state</text>
<text x="48.0" y="394.0" font-size="14" text-anchor="start" fill="#e6edf3">The grant is current and not revoked</text>
<rect x="26.0" y="382.7" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 388.9 L31.2 391.6 L35.6 385.8" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="420.5" font-size="14" text-anchor="start" fill="#e6edf3">The evidence is current and fresh</text>
<rect x="26.0" y="409.2" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 415.4 L31.2 418.1 L35.6 412.3" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="447.0" font-size="14" text-anchor="start" fill="#e6edf3">The preconditions hold</text>
<rect x="26.0" y="435.7" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 441.9 L31.2 444.5 L35.6 438.8" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="473.4" font-size="14" text-anchor="start" fill="#e6edf3">The parameters and target match</text>
<rect x="26.0" y="462.1" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 468.4 L31.2 471.0 L35.6 465.3" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="499.9" font-size="14" text-anchor="start" fill="#e6edf3">The per-action limit holds</text>
<rect x="26.0" y="488.6" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 494.9 L31.2 497.5 L35.6 491.7" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="48.0" y="526.4" font-size="14" text-anchor="start" fill="#e6edf3">The cumulative limit holds, counting</text>
<text x="48.0" y="544.9" font-size="14" text-anchor="start" fill="#e6edf3">consumed and reserved capacity</text>
<rect x="26.0" y="515.1" width="12" height="12" rx="2.5" fill="none" stroke="#E3B341" stroke-width="1.6"/>
<path d="M28.6 521.3 L31.2 524.0 L35.6 518.2" fill="none" stroke="#E3B341" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M105.0 572.1 L105.0 594.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M280.0 572.1 L280.0 594.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="596.1" width="190.0" height="111.4" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="20.0" y="620.0" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Every check passes</text>
<text x="20.0" y="641.2" font-size="13" text-anchor="start" fill="#D2F8DB">Reserve allowance.</text>
<text x="20.0" y="658.3" font-size="13" text-anchor="start" fill="#D2F8DB">Submit the exact action</text>
<text x="20.0" y="675.5" font-size="13" text-anchor="start" fill="#D2F8DB">to the target. Record the</text>
<text x="20.0" y="692.6" font-size="13" text-anchor="start" fill="#D2F8DB">outcome, or a timeout.</text>
<rect x="210.0" y="596.1" width="140.0" height="111.4" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.6"/>
<text x="220.0" y="620.0" font-size="15" text-anchor="start" font-weight="700" fill="#FFD8D3">A check fails</text>
<text x="220.0" y="641.2" font-size="13" text-anchor="start" fill="#FFD8D3">Rejected before</text>
<text x="220.0" y="658.3" font-size="13" text-anchor="start" fill="#FFD8D3">submission.</text>
<text x="220.0" y="675.5" font-size="13" text-anchor="start" fill="#FFD8D3">Nothing is</text>
<text x="220.0" y="692.6" font-size="13" text-anchor="start" fill="#FFD8D3">submitted.</text>
<path d="M105.0 707.4 L105.0 729.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M280.0 707.4 L280.0 729.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="731.4" width="340.0" height="156.6" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="20.0" y="755.4" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Receipt (C07)</text>
<text x="20.0" y="777.5" font-size="14" text-anchor="start" fill="#D2F8DB">After a pass, the receipt records one of four</text>
<text x="20.0" y="796.0" font-size="14" text-anchor="start" fill="#D2F8DB">states: completed and verified, unknown,</text>
<text x="20.0" y="814.5" font-size="14" text-anchor="start" fill="#D2F8DB">partly verified, or verified no effect.</text>
<text x="20.0" y="835.9" font-size="14" text-anchor="start" fill="#D2F8DB">After a failed check: the rejection</text>
<text x="20.0" y="854.4" font-size="14" text-anchor="start" fill="#D2F8DB">and its reasons. A rejection alone</text>
<text x="20.0" y="872.9" font-size="14" text-anchor="start" fill="#D2F8DB">is not a verified no-effect.</text>
<path d="M180.0 888.1 L180.0 911.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="912.1" width="340.0" height="94.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="20.0" y="936.0" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Authoritative verification</text>
<text x="20.0" y="957.2" font-size="13" text-anchor="start" fill="#CDE4FF">against the target, for this attempt, target</text>
<text x="20.0" y="974.3" font-size="13" text-anchor="start" fill="#CDE4FF">and scope: confirms or reconciles the</text>
<text x="20.0" y="991.5" font-size="13" text-anchor="start" fill="#CDE4FF">outcome, or confirms that there was no effect</text>
</svg>
