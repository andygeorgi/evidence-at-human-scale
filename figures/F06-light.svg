<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Receipt states and recovery</title>
<desc id="d">An action starts as submitted after the gateway passes every check and reserves allowance. It becomes completed and verified when an authoritative outcome confirms the effect, or not executed and verified when an authoritative check confirms no business effect. With a timeout or no response it is unknown, and when only some effects are verified it is partial. While unknown or partial, allowance stays reserved or charged, there is no blind retry, and a timeout or lease expiry never restores allowance. Unknown becomes completed or not executed only through authoritative reconciliation. Partial becomes completed through reconciliation or compensation under policy.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="1000" height="540" fill="#ffffff"/>
<rect x="380.0" y="14.0" width="240.0" height="64.0" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="500.0" y="33.0" font-size="17" text-anchor="middle" font-weight="700" fill="#0B2540">submitted</text>
<text x="500.0" y="57.3" font-size="12.5" text-anchor="middle" fill="#0B2540">every check passed,</text>
<text x="500.0" y="73.8" font-size="12.5" text-anchor="middle" fill="#0B2540">allowance reserved</text>
<path d="M500.0 78.0 L500.0 122.0" fill="none" stroke="#57606a" stroke-width="1.8"/>
<path d="M134.0 122.0 L866.0 122.0" fill="none" stroke="#57606a" stroke-width="1.8"/>
<rect x="24.0" y="168.0" width="220.0" height="132.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="134.0" y="212.5" font-size="16" text-anchor="middle" font-weight="700" fill="#3D2500">unknown</text>
<text x="134.0" y="235.5" font-size="12.5" text-anchor="middle" fill="#3D2500">timeout or no response.</text>
<text x="134.0" y="252.0" font-size="12.5" text-anchor="middle" fill="#3D2500">Leaves only by</text>
<text x="134.0" y="268.5" font-size="12.5" text-anchor="middle" fill="#3D2500">authoritative reconciliation</text>
<path d="M134.0 122.0 L134.0 168.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="264.0" y="168.0" width="220.0" height="132.0" rx="8" fill="#FFF1D6" stroke="#B26A00" stroke-width="1.6"/>
<text x="374.0" y="204.2" font-size="16" text-anchor="middle" font-weight="700" fill="#3D2500">partial</text>
<text x="374.0" y="227.2" font-size="12.5" text-anchor="middle" fill="#3D2500">some effects verified,</text>
<text x="374.0" y="243.7" font-size="12.5" text-anchor="middle" fill="#3D2500">others not; known effects</text>
<text x="374.0" y="260.2" font-size="12.5" text-anchor="middle" fill="#3D2500">stay charged. Leaves by</text>
<text x="374.0" y="276.7" font-size="12.5" text-anchor="middle" fill="#3D2500">reconciliation or compensation</text>
<path d="M374.0 122.0 L374.0 168.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="516.0" y="168.0" width="220.0" height="132.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="626.0" y="220.3" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0F2E1B">completed_verified</text>
<text x="626.0" y="241.4" font-size="12.5" text-anchor="middle" fill="#0F2E1B">authoritative outcome</text>
<text x="626.0" y="257.9" font-size="12.5" text-anchor="middle" fill="#0F2E1B">confirms the effect</text>
<path d="M626.0 122.0 L626.0 168.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="756.0" y="168.0" width="220.0" height="132.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="866.0" y="220.3" font-size="14.5" text-anchor="middle" font-weight="700" fill="#0F2E1B">not_executed_verified</text>
<text x="866.0" y="241.4" font-size="12.5" text-anchor="middle" fill="#0F2E1B">authoritatively verified:</text>
<text x="866.0" y="257.9" font-size="12.5" text-anchor="middle" fill="#0F2E1B">no business effect</text>
<path d="M866.0 122.0 L866.0 168.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M484.0 234.0 L516.0 234.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M150.0 300.0 L150.0 338.0 L626.0 338.0 L626.0 300.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M98.0 300.0 L98.0 376.0 L866.0 376.0 L866.0 300.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="388.0" y="358.0" font-size="12.5" text-anchor="middle" fill="#57606a">authoritative reconciliation: effect confirmed</text>
<text x="482.0" y="396.0" font-size="12.5" text-anchor="middle" fill="#57606a">authoritative reconciliation: no effect confirmed</text>
<text x="500.0" y="478.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1b1f24">Amber: unresolved. Allowance stays reserved or charged, there is no blind retry,</text>
<text x="500.0" y="498.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#1b1f24">and a timeout or lease expiry never restores allowance. Green: verified and terminal.</text>
<text x="500.0" y="522.0" font-size="12.5" text-anchor="middle" fill="#57606a">Allowance is restored only on authoritative reconciliation, never by assuming that silence means no effect.</text>
</svg>
