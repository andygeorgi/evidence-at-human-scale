<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 767" width="360" height="767" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Receipt states and recovery</title>
<desc id="d">A submitted action leads to four receipt states. Outcome unknown and partly verified are open, drawn in amber: allowance stays reserved or charged. Only authoritative reconciliation moves an unknown outcome to completed and verified, or to verified no effect. Reconciliation or compensation, under policy, moves a partly verified one to completed and verified. Those two are final, drawn in green.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="360" height="767" fill="#ffffff"/>
<rect x="34.0" y="10.0" width="316.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="44.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">submitted</text>
<text x="44.0" y="55.1" font-size="13" text-anchor="start" fill="#0B2540">every check passed, allowance reserved</text>
<rect x="34.0" y="97.9" width="316.0" height="160.5" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<rect x="287.7" y="105.9" width="52.3" height="23.0" rx="11.5" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="313.8" y="121.8" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">open</text>
<text x="44.0" y="122.8" font-size="16" text-anchor="start" font-weight="700" fill="#3D2500">Outcome unknown</text>
<text x="44.0" y="144.3" font-size="13" text-anchor="start" fill="#3D2500">unknown · timeout or no response</text>
<text x="44.0" y="164.4" font-size="13" text-anchor="start" fill="#3D2500">Only authoritative reconciliation</text>
<text x="44.0" y="181.6" font-size="13" text-anchor="start" fill="#3D2500">moves it on:</text>
<rect x="48.0" y="192.4" width="193.3" height="26.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="144.7" y="209.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">Completed and verified</text>
<rect x="48.0" y="222.4" width="149.4" height="26.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="122.7" y="239.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">Verified no effect</text>
<rect x="34.0" y="270.4" width="316.0" height="147.6" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<rect x="287.7" y="278.4" width="52.3" height="23.0" rx="11.5" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="313.8" y="294.3" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">open</text>
<text x="44.0" y="295.3" font-size="16" text-anchor="start" font-weight="700" fill="#3D2500">Partly verified</text>
<text x="44.0" y="316.7" font-size="13" text-anchor="start" fill="#3D2500">partial · some effects verified, others</text>
<text x="44.0" y="333.9" font-size="13" text-anchor="start" fill="#3D2500">not; known effects stay charged</text>
<text x="44.0" y="354.1" font-size="13" text-anchor="start" fill="#3D2500">Reconciliation or compensation,</text>
<text x="44.0" y="371.2" font-size="13" text-anchor="start" fill="#3D2500">under policy, moves it on:</text>
<rect x="48.0" y="382.0" width="193.3" height="26.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="144.7" y="399.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">Completed and verified</text>
<rect x="34.0" y="430.0" width="316.0" height="78.3" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<rect x="291.3" y="438.0" width="48.7" height="23.0" rx="11.5" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="315.7" y="453.9" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">final</text>
<text x="44.0" y="454.9" font-size="16" text-anchor="start" font-weight="700" fill="#0F2E1B">Completed and verified</text>
<text x="44.0" y="476.4" font-size="13" text-anchor="start" fill="#0F2E1B">completed_verified · an authoritative</text>
<text x="44.0" y="493.5" font-size="13" text-anchor="start" fill="#0F2E1B">outcome confirms the effect</text>
<rect x="34.0" y="520.3" width="316.0" height="95.5" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<rect x="291.3" y="528.3" width="48.7" height="23.0" rx="11.5" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="315.7" y="544.3" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">final</text>
<text x="44.0" y="545.2" font-size="16" text-anchor="start" font-weight="700" fill="#0F2E1B">Verified no effect</text>
<text x="44.0" y="566.7" font-size="13" text-anchor="start" fill="#0F2E1B">not_executed_verified ·</text>
<text x="44.0" y="583.9" font-size="13" text-anchor="start" fill="#0F2E1B">authoritatively verified: no effect</text>
<text x="44.0" y="601.0" font-size="13" text-anchor="start" fill="#0F2E1B">for this attempt, target and scope</text>
<path d="M34.0 40.0 L16.0 40.0 L16.0 541.3" fill="none" stroke="#57606a" stroke-width="1.8"/>
<path d="M16.0 118.9 L33.0 118.9" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 291.4 L33.0 291.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 451.0 L33.0 451.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M16.0 541.3 L33.0 541.3" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="627.8" width="340.0" height="128.6" rx="8" fill="#F4F4F4" stroke="#6F6F6F" stroke-width="1.6"/>
<text x="20.0" y="651.8" font-size="15" text-anchor="start" font-weight="700" fill="#222222">Open states keep the reservation</text>
<text x="20.0" y="672.9" font-size="13" text-anchor="start" fill="#222222">While a state is open, allowance</text>
<text x="20.0" y="690.1" font-size="13" text-anchor="start" fill="#222222">stays reserved or charged and there</text>
<text x="20.0" y="707.2" font-size="13" text-anchor="start" fill="#222222">is no blind retry. A timeout or lease</text>
<text x="20.0" y="724.4" font-size="13" text-anchor="start" fill="#222222">expiry never restores allowance; only</text>
<text x="20.0" y="741.6" font-size="13" text-anchor="start" fill="#222222">authoritative reconciliation does.</text>
</svg>
