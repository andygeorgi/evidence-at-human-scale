<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 729" width="360" height="729" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How the seven contracts refer to each other</title>
<desc id="d">An evidence record (C02) is drawn at the top, with dashed arrows to the selection (C03), decision packet (C04), action proposal (C05), delegation (C06) and execution receipt (C07) for references by exact version. Below it, solid arrows run down a chain: context (C01), selection, decision packet, action proposal, delegation and execution receipt. The receipt references one proposal and one grant.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="729" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="77.1" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="20.0" y="34.0" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Evidence record (C02)</text>
<text x="20.0" y="55.1" font-size="13" text-anchor="start" fill="#CDE4FF">typed records with lineage, referenced by</text>
<text x="20.0" y="72.3" font-size="13" text-anchor="start" fill="#CDE4FF">exact version from every later contract</text>
<rect x="44.0" y="109.1" width="292.0" height="59.9" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="54.0" y="133.0" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Context (C01)</text>
<text x="54.0" y="154.2" font-size="13" text-anchor="start" fill="#CFF6F9">who, what, why, as of when</text>
<path d="M190.0 169.0 L190.0 198.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="202.0" y="188.6" font-size="13" text-anchor="start" fill="#9da7b3">context</text>
<rect x="44.0" y="199.0" width="292.0" height="59.9" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="54.0" y="222.9" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Selection manifest (C03)</text>
<text x="54.0" y="244.1" font-size="13" text-anchor="start" fill="#CFF6F9">manifest, gaps, obligations</text>
<path d="M190.0 258.9 L190.0 287.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="202.0" y="278.5" font-size="13" text-anchor="start" fill="#9da7b3">context + selection</text>
<rect x="44.0" y="288.9" width="292.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="54.0" y="312.8" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Decision packet (C04)</text>
<text x="54.0" y="334.0" font-size="13" text-anchor="start" fill="#D2F8DB">claims, inferences, gaps</text>
<path d="M190.0 348.8 L190.0 377.8" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="202.0" y="368.4" font-size="13" text-anchor="start" fill="#9da7b3">context + packet</text>
<rect x="44.0" y="378.8" width="292.0" height="59.9" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="54.0" y="402.7" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Action proposal (C05)</text>
<text x="54.0" y="423.9" font-size="13" text-anchor="start" fill="#E6DAFF">proposed, not executed</text>
<path d="M190.0 438.7 L190.0 467.7" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="202.0" y="458.3" font-size="13" text-anchor="start" fill="#9da7b3">bound to</text>
<rect x="44.0" y="468.7" width="292.0" height="59.9" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="54.0" y="492.7" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Delegation (C06)</text>
<text x="54.0" y="513.8" font-size="13" text-anchor="start" fill="#E6DAFF">exact approval or bounded class</text>
<path d="M190.0 528.6 L190.0 557.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="202.0" y="548.2" font-size="13" text-anchor="start" fill="#9da7b3">grant</text>
<rect x="44.0" y="558.6" width="292.0" height="77.1" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="54.0" y="582.6" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Execution receipt (C07)</text>
<text x="54.0" y="603.7" font-size="13" text-anchor="start" fill="#D2F8DB">verified outcome; references</text>
<text x="54.0" y="620.9" font-size="13" text-anchor="start" fill="#D2F8DB">one proposal and one grant</text>
<path d="M20.0 87.1 L20.0 597.2" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M20.0 228.9 L43.0 228.9" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M20.0 318.8 L43.0 318.8" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M20.0 408.8 L43.0 408.8" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M20.0 498.7 L43.0 498.7" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M20.0 597.2 L43.0 597.2" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<path d="M336.0 408.8 L345.0 408.8 L345.0 597.2 L337.0 597.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="10.0" y="662.0" font-size="13" text-anchor="start" fill="#9da7b3">Solid arrows are carried forward; the line</text>
<text x="10.0" y="679.2" font-size="13" text-anchor="start" fill="#9da7b3">beside the delegation is the proposal that</text>
<text x="10.0" y="696.4" font-size="13" text-anchor="start" fill="#9da7b3">the receipt references. Dashed arrows</text>
<text x="10.0" y="713.5" font-size="13" text-anchor="start" fill="#9da7b3">reference an exact evidence version.</text>
</svg>
