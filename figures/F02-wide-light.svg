<text x="607.0" y="777.1" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">target</text>
<rect x="738.5" y="740.6" width="119.5" height="102.1" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="744.5" y="759.6" font-size="14" text-anchor="start" font-weight="700" fill="#0F2E1B">Verified</text>
<text x="744.5" y="777.1" font-size="14" text-anchor="start" font-weight="700" fill="#0F2E1B">receipt (C07)</text>
