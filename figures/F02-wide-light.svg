<text x="482.0" y="118.6" font-size="13" text-anchor="start" fill="#57606a">return or outcome</text>
<rect x="314.0" y="190.5" width="556.0" height="130.2" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="328.0" y="212.5" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">MANDATORY CONTINUITY PATH</text>
<text x="328.0" y="230.5" font-size="13" text-anchor="start" fill="#57606a">branches from step 3, the registry; no LLM dependency</text>
<rect x="326.0" y="240.5" width="165.3" height="68.2" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="332.0" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">Deterministic</text>
<text x="332.0" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">detection</text>
<rect x="509.3" y="240.5" width="165.3" height="68.2" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="515.3" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">Authorized</text>
<text x="515.3" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">notification</text>
<text x="515.3" y="294.5" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">and queue</text>
<rect x="692.7" y="240.5" width="165.3" height="68.2" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="698.7" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">Acknowledgement</text>
<text x="698.7" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#0B2540">or escalation</text>
<text x="698.7" y="297.8" font-size="13" text-anchor="start" fill="#0B2540">receipt, not resolution</text>
