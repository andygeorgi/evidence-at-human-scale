<text x="60.0" y="615.9" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">Bounded synthesis</text>
<text x="60.0" y="637.0" font-size="13" text-anchor="start" fill="#0F2E1B">candidate decision packet</text>
<circle cx="32.0" cy="612.9" r="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1.6"/>
