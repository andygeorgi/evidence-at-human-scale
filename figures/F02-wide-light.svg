<text x="332.0" y="780.4" font-size="13" text-anchor="start" fill="#24133F">of an exact</text>
<text x="332.0" y="797.6" font-size="13" text-anchor="start" fill="#24133F">proposal (C05),</text>
<text x="332.0" y="814.8" font-size="13" text-anchor="start" fill="#24133F">or a bounded</text>
<text x="332.0" y="831.9" font-size="13" text-anchor="start" fill="#24133F">grant (C06)</text>
<rect x="463.5" y="740.6" width="119.5" height="102.1" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
