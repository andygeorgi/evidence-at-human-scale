<path d="M674.7 274.5 L692.7 274.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrs)"/>
<path d="M280.0 264.5 L326.0 264.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="314.0" y="690.6" width="556.0" height="164.1" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="328.0" y="712.6" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">ACTION PATH</text>
<text x="328.0" y="730.6" font-size="13" text-anchor="start" fill="#57606a">starts at step 9, the review; a separate path</text>
