<rect x="50.0" y="748.9" width="230.0" height="95.8" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="60.0" y="772.9" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">Review of the</text>
<text x="60.0" y="791.6" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">packet (C04)</text>
<text x="60.0" y="812.8" font-size="13" text-anchor="start" fill="#24133F">the Decision Owner</text>
<text x="60.0" y="829.9" font-size="13" text-anchor="start" fill="#24133F">inspects and challenges</text>
