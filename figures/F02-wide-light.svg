<text x="324.0" y="482.4" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">Reassessment and invalidation</text>
<text x="324.0" y="503.6" font-size="13" text-anchor="start" fill="#3D2500">Corrections, revocations, late evidence, challenges and verified</text>
