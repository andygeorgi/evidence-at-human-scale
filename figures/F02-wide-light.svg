<text x="60.0" y="111.4" font-size="13" text-anchor="start" fill="#0B2540">records, events,</text>
<text x="60.0" y="128.6" font-size="13" text-anchor="start" fill="#0B2540">services, analytics</text>
<circle cx="32.0" cy="87.3" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="91.9" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<rect x="50.0" y="153.4" width="230.0" height="77.1" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="60.0" y="177.3" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Admission</text>
<text x="60.0" y="198.5" font-size="13" text-anchor="start" fill="#0B2540">registered producer,</text>
<text x="60.0" y="215.6" font-size="13" text-anchor="start" fill="#0B2540">permitted kind</text>
<circle cx="32.0" cy="174.4" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="179.0" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<path d="M32.0 100.3 L32.0 161.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="240.5" width="230.0" height="59.9" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="60.0" y="264.4" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">Registry (C02)</text>
<text x="60.0" y="285.6" font-size="13" text-anchor="start" fill="#0B2540">admitted immutable versions</text>
<circle cx="32.0" cy="261.5" r="12" fill="#2F6DB5" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="266.1" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
