<path d="M32.0 520.1 L32.0 599.9" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="661.8" width="230.0" height="77.1" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="60.0" y="685.8" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">Release validation</text>
<text x="60.0" y="706.9" font-size="13" text-anchor="start" fill="#0F2E1B">claim, reference,</text>
<text x="60.0" y="724.1" font-size="13" text-anchor="start" fill="#0F2E1B">disclosure checks</text>
<circle cx="32.0" cy="682.8" r="12" fill="#2E7D4F" stroke="#2E7D4F" stroke-width="1.6"/>
