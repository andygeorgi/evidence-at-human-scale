<text x="60.0" y="550.0" font-size="13" text-anchor="start" fill="#06323A">retrieved, kept,</text>
<text x="60.0" y="567.1" font-size="13" text-anchor="start" fill="#06323A">excluded, missing</text>
<circle cx="32.0" cy="507.1" r="12" fill="#1E7F8C" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="511.7" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">6</text>
<path d="M32.0 450.2 L32.0 494.1" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
