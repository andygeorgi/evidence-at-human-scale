<text x="412.4" y="91.4" font-size="13" text-anchor="middle" font-weight="700" fill="#24133F">owner and authority</text>
<rect x="504.9" y="74.0" width="206.4" height="26.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="608.1" y="91.4" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">checks and reassessment</text>
