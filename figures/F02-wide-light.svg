<text x="60.0" y="334.3" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">Authorized retrieval</text>
<text x="60.0" y="353.1" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">(context C01)</text>
<text x="60.0" y="374.2" font-size="13" text-anchor="start" fill="#06323A">candidate evidence</text>
<text x="60.0" y="391.4" font-size="13" text-anchor="start" fill="#06323A">and coverage</text>
