<text x="60.0" y="440.1" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">Relevance and coverage</text>
<text x="60.0" y="461.3" font-size="13" text-anchor="start" fill="#06323A">priority, grouping, exclusions</text>
<circle cx="32.0" cy="437.2" r="12" fill="#1E7F8C" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="441.8" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">5</text>
<path d="M32.0 344.4 L32.0 424.2" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="486.1" width="230.0" height="95.8" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
