<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1295" width="360" height="1295" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Which missingness label applies?</title>
<desc id="d">Seven questions, asked in order. If the reader&#x27;s principal may not know the input exists, nothing is shown. If it may not read the input, the label is inaccessible, in the permitted wording only. Otherwise the answers give stale, not_assessed, unavailable, missing or negative, and else not_retrieved.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="360" height="1295" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="340.0" height="57.0" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<text x="180.0" y="33.3" font-size="14" text-anchor="middle" fill="#e6edf3">An expected input is not</text>
<text x="180.0" y="51.8" font-size="14" text-anchor="middle" fill="#e6edf3">in front of the reader</text>
<path d="M180.0 67.0 L180.0 92.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="84.6" font-size="13" text-anchor="start" fill="#9da7b3">ask in order</text>
<rect x="10.0" y="93.0" width="340.0" height="134.6" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="114.0" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="118.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">1</text>
<text x="56.0" y="116.7" font-size="14.5" text-anchor="start" fill="#e6edf3">May the reader&#x27;s principal</text>
<text x="56.0" y="135.9" font-size="14.5" text-anchor="start" fill="#e6edf3">know that this input exists?</text>
<text x="56.0" y="167.2" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">no</text>
<path d="M82.4 162.2 L104.4 162.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="149.2" width="84.0" height="26.0" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.4"/>
<text x="154.4" y="166.7" font-size="13" text-anchor="middle" font-weight="700" fill="#FFD8D3">no entry</text>
<text x="56.0" y="195.6" font-size="13" text-anchor="start" fill="#e6edf3">nothing about it is</text>
<text x="56.0" y="212.8" font-size="13" text-anchor="start" fill="#e6edf3">shown, not even its state</text>
<path d="M180.0 227.6 L180.0 252.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="245.2" font-size="13" text-anchor="start" fill="#9da7b3">yes</text>
<rect x="10.0" y="253.6" width="340.0" height="115.5" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="274.6" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="279.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">2</text>
<text x="56.0" y="277.3" font-size="14.5" text-anchor="start" fill="#e6edf3">May the reader&#x27;s principal read it?</text>
<text x="56.0" y="308.7" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">no</text>
<path d="M82.4 303.7 L104.4 303.7" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="290.7" width="111.3" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="168.0" y="308.1" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">inaccessible</text>
<text x="56.0" y="337.1" font-size="13" text-anchor="start" fill="#e6edf3">the permitted wording only: no</text>
<text x="56.0" y="354.2" font-size="13" text-anchor="start" fill="#e6edf3">name, type, count, state or age</text>
<path d="M180.0 369.0 L180.0 394.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="386.6" font-size="13" text-anchor="start" fill="#9da7b3">yes</text>
<rect x="10.0" y="395.0" width="340.0" height="92.3" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="416.0" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="420.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">3</text>
<text x="56.0" y="418.8" font-size="14.5" text-anchor="start" fill="#e6edf3">Is a record available but failing</text>
<text x="56.0" y="437.9" font-size="14.5" text-anchor="start" fill="#e6edf3">the freshness requirement?</text>
<text x="56.0" y="469.3" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">yes</text>
<path d="M89.1 464.3 L111.1 464.3" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="119.1" y="451.3" width="57.8" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="148.0" y="468.7" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">stale</text>
<path d="M180.0 487.3 L180.0 512.3" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="504.9" font-size="13" text-anchor="start" fill="#9da7b3">no</text>
<rect x="10.0" y="513.3" width="340.0" height="92.3" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="534.3" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="538.9" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">4</text>
<text x="56.0" y="537.1" font-size="14.5" text-anchor="start" fill="#e6edf3">Was the check or</text>
<text x="56.0" y="556.2" font-size="14.5" text-anchor="start" fill="#e6edf3">assessment performed?</text>
<text x="56.0" y="587.6" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">no</text>
<path d="M82.4 582.6 L104.4 582.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="569.6" width="122.3" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="173.5" y="587.0" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">not_assessed</text>
<path d="M180.0 605.6 L180.0 630.6" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="623.2" font-size="13" text-anchor="start" fill="#9da7b3">yes</text>
<rect x="10.0" y="631.6" width="340.0" height="117.4" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="652.6" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="657.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">5</text>
<text x="56.0" y="655.4" font-size="14.5" text-anchor="start" fill="#e6edf3">Did the source or</text>
<text x="56.0" y="674.5" font-size="14.5" text-anchor="start" fill="#e6edf3">dependency answer?</text>
<text x="56.0" y="705.9" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">no</text>
<path d="M82.4 700.9 L104.4 700.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="687.9" width="107.0" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="165.9" y="705.3" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">unavailable</text>
<text x="56.0" y="734.2" font-size="13" text-anchor="start" fill="#e6edf3">not the same as denied</text>
<path d="M180.0 749.0 L180.0 774.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="766.6" font-size="13" text-anchor="start" fill="#9da7b3">yes</text>
<rect x="10.0" y="775.0" width="340.0" height="115.5" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="796.0" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="800.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">6</text>
<text x="56.0" y="798.8" font-size="14.5" text-anchor="start" fill="#e6edf3">Did a scoped retrieval complete?</text>
<text x="56.0" y="830.2" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">no</text>
<path d="M82.4 825.2 L104.4 825.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="112.4" y="812.2" width="79.0" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="151.9" y="829.6" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">missing</text>
<text x="56.0" y="858.5" font-size="13" text-anchor="start" fill="#e6edf3">expected, not obtained;</text>
<text x="56.0" y="875.7" font-size="13" text-anchor="start" fill="#e6edf3">reason may be unknown</text>
<path d="M180.0 890.5 L180.0 915.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="908.1" font-size="13" text-anchor="start" fill="#9da7b3">yes</text>
<rect x="10.0" y="916.5" width="340.0" height="134.6" rx="8" fill="#21262D" stroke="#8b949e" stroke-width="1.6"/>
<circle cx="32.0" cy="937.5" r="12" fill="#8b949e" stroke="#8b949e" stroke-width="1.6"/>
<text x="32.0" y="942.1" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">7</text>
<text x="56.0" y="940.3" font-size="14.5" text-anchor="start" fill="#e6edf3">Was absence observed, with method,</text>
<text x="56.0" y="959.4" font-size="14.5" text-anchor="start" fill="#e6edf3">time and complete coverage?</text>
<text x="56.0" y="990.8" font-size="13" text-anchor="start" font-weight="700" fill="#e6edf3">yes</text>
<path d="M89.1 985.8 L111.1 985.8" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="119.1" y="972.8" width="85.8" height="26.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="162.0" y="990.2" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">negative</text>
<text x="56.0" y="1019.1" font-size="13" text-anchor="start" fill="#e6edf3">an adequately scoped</text>
<text x="56.0" y="1036.3" font-size="13" text-anchor="start" fill="#e6edf3">observation of absence</text>
<path d="M180.0 1051.1 L180.0 1076.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="1068.7" font-size="13" text-anchor="start" fill="#9da7b3">no</text>
<rect x="10.0" y="1077.1" width="340.0" height="77.1" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="20.0" y="1101.0" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">not_retrieved</text>
<text x="20.0" y="1122.2" font-size="13" text-anchor="start" fill="#FFEBC2">a completed retrieval found</text>
<text x="20.0" y="1139.3" font-size="13" text-anchor="start" fill="#FFEBC2">nothing; not evidence of absence</text>
<text x="180.0" y="1184.4" font-size="15" text-anchor="middle" font-weight="700" fill="#e6edf3">Only negative is evidence of absence.</text>
<text x="180.0" y="1204.3" font-size="13" text-anchor="middle" fill="#9da7b3">Each of the other six labels says why nothing</text>
<text x="180.0" y="1221.5" font-size="13" text-anchor="middle" fill="#9da7b3">can be concluded from the missing input.</text>
<text x="180.0" y="1244.6" font-size="13" text-anchor="middle" fill="#9da7b3">The two permission questions come</text>
<text x="180.0" y="1261.8" font-size="13" text-anchor="middle" fill="#9da7b3">first: what a reader may be told is</text>
<text x="180.0" y="1278.9" font-size="13" text-anchor="middle" fill="#9da7b3">decided before any state is worked out.</text>
</svg>
