<text x="51.0" y="224.0" font-size="14" text-anchor="start" font-weight="700" fill="#CFF6F9">Three-way match</text>
<text x="51.0" y="241.0" font-size="13" text-anchor="start" fill="#CFF6F9">deterministic finding</text>
<rect x="39.0" y="260.0" width="226.0" height="46.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.3"/>
<text x="51.0" y="278.0" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">AI explanation</text>
<text x="51.0" y="295.0" font-size="13" text-anchor="start" fill="#FFEBC2">model inference</text>
