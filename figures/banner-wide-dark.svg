<text x="688.1" y="252.4" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">Approve</text>
<text x="744.9" y="253.0" font-size="13" text-anchor="middle" fill="#9da7b3">or</text>
<rect x="759.9" y="232.0" width="63.7" height="32.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="791.7" y="252.4" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">Hold</text>
<text x="735.0" y="290.0" font-size="13" text-anchor="middle" fill="#9da7b3">Current evidence is rechecked</text>
<text x="735.0" y="308.0" font-size="13" text-anchor="middle" fill="#9da7b3">before action</text>
<path d="M278.0 212.0 L302.0 212.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M592.0 212.0 L616.0 212.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
