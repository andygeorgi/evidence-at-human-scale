<text x="447.0" y="130.0" font-size="17" text-anchor="middle" font-weight="700" fill="#D2F8DB">One decision packet</text>
<rect x="315.0" y="152.0" width="264.0" height="36.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.3"/>
<text x="327.0" y="175.0" font-size="14" text-anchor="start" font-weight="700" fill="#D2F8DB">Claims</text>
<text x="567.0" y="175.0" font-size="13" text-anchor="end" fill="#D2F8DB">cite evidence</text>
<rect x="315.0" y="194.0" width="264.0" height="36.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.3"/>
<text x="327.0" y="217.0" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">Inferences</text>
<text x="567.0" y="217.0" font-size="13" text-anchor="end" fill="#FFEBC2">remain labeled</text>
<rect x="315.0" y="236.0" width="264.0" height="36.0" rx="8" fill="#4D1511" stroke="#F85149" stroke-width="1.3"/>
<text x="327.0" y="259.0" font-size="14" text-anchor="start" font-weight="700" fill="#FFD8D3">Conflicts and gaps</text>
<text x="567.0" y="259.0" font-size="13" text-anchor="end" fill="#FFD8D3">stay visible</text>
<rect x="315.0" y="278.0" width="264.0" height="36.0" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.3"/>
<text x="327.0" y="301.0" font-size="14" text-anchor="start" font-weight="700" fill="#E6DAFF">Proposals</text>
