<text x="60.0" y="440.1" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Relevance and coverage</text>
<text x="60.0" y="461.3" font-size="13" text-anchor="start" fill="#CFF6F9">priority, grouping, exclusions</text>
<circle cx="32.0" cy="437.2" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="441.8" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">5</text>
<path d="M32.0 344.4 L32.0 424.2" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="486.1" width="230.0" height="95.8" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="60.0" y="510.1" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Selection</text>
<text x="60.0" y="528.8" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">manifest (C03)</text>
<text x="60.0" y="550.0" font-size="13" text-anchor="start" fill="#CFF6F9">retrieved, kept,</text>
<text x="60.0" y="567.1" font-size="13" text-anchor="start" fill="#CFF6F9">excluded, missing</text>
<circle cx="32.0" cy="507.1" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="511.7" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">6</text>
<path d="M32.0 450.2 L32.0 494.1" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="591.9" width="230.0" height="59.9" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="60.0" y="615.9" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Bounded synthesis</text>
<text x="60.0" y="637.0" font-size="13" text-anchor="start" fill="#D2F8DB">candidate decision packet</text>
<circle cx="32.0" cy="612.9" r="12" fill="#56D364" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="617.5" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">7</text>
<path d="M32.0 520.1 L32.0 599.9" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="661.8" width="230.0" height="77.1" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="60.0" y="685.8" font-size="15" text-anchor="start" font-weight="700" fill="#D2F8DB">Release validation</text>
<text x="60.0" y="706.9" font-size="13" text-anchor="start" fill="#D2F8DB">claim, reference,</text>
<text x="60.0" y="724.1" font-size="13" text-anchor="start" fill="#D2F8DB">disclosure checks</text>
<circle cx="32.0" cy="682.8" r="12" fill="#56D364" stroke="#56D364" stroke-width="1.6"/>
<text x="32.0" y="687.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">8</text>
<path d="M32.0 625.9 L32.0 669.8" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="748.9" width="230.0" height="95.8" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="60.0" y="772.9" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">Review of the</text>
<text x="60.0" y="791.6" font-size="15" text-anchor="start" font-weight="700" fill="#E6DAFF">packet (C04)</text>
<text x="60.0" y="812.8" font-size="13" text-anchor="start" fill="#E6DAFF">the Decision Owner</text>
<text x="60.0" y="829.9" font-size="13" text-anchor="start" fill="#E6DAFF">inspects and challenges</text>
<circle cx="32.0" cy="769.9" r="12" fill="#A371F7" stroke="#A371F7" stroke-width="1.6"/>
<text x="32.0" y="774.5" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">9</text>
