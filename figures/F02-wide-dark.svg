<text x="418.2" y="61.4" font-size="13" text-anchor="middle" font-weight="700" fill="#CDE4FF">evidence and systems</text>
<rect x="516.4" y="44.0" width="176.3" height="26.0" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.4"/>
<text x="604.5" y="61.4" font-size="13" text-anchor="middle" font-weight="700" fill="#CFF6F9">context and selection</text>
<rect x="700.6" y="44.0" width="154.9" height="26.0" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.4"/>
<text x="778.1" y="61.4" font-size="13" text-anchor="middle" font-weight="700" fill="#D2F8DB">packet and receipt</text>
<rect x="328.0" y="74.0" width="168.9" height="26.0" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.4"/>
<text x="412.4" y="91.4" font-size="13" text-anchor="middle" font-weight="700" fill="#E6DAFF">owner and authority</text>
<rect x="504.9" y="74.0" width="206.4" height="26.0" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.4"/>
<text x="608.1" y="91.4" font-size="13" text-anchor="middle" font-weight="700" fill="#FFEBC2">checks and reassessment</text>
<path d="M328.0 114.0 L368.0 114.0" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrs)"/>
<text x="376.0" y="118.6" font-size="13" text-anchor="start" fill="#9da7b3">flow</text>
<path d="M434.0 114.0 L474.0 114.0" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
<text x="482.0" y="118.6" font-size="13" text-anchor="start" fill="#9da7b3">return or outcome</text>
<rect x="314.0" y="190.5" width="556.0" height="130.2" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="328.0" y="212.5" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">MANDATORY CONTINUITY PATH</text>
<text x="328.0" y="230.5" font-size="13" text-anchor="start" fill="#9da7b3">branches from step 3, the registry; no LLM dependency</text>
<rect x="326.0" y="240.5" width="165.3" height="68.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="332.0" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">Deterministic</text>
<text x="332.0" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">detection</text>
<rect x="509.3" y="240.5" width="165.3" height="68.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="515.3" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">Authorized</text>
<text x="515.3" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">notification</text>
<text x="515.3" y="294.5" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">and queue</text>
<rect x="692.7" y="240.5" width="165.3" height="68.2" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="698.7" y="259.5" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">Acknowledgement</text>
<text x="698.7" y="277.0" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">or escalation</text>
<text x="698.7" y="297.8" font-size="13" text-anchor="start" fill="#CDE4FF">receipt, not resolution</text>
<path d="M491.3 274.5 L509.3 274.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrs)"/>
<path d="M674.7 274.5 L692.7 274.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrs)"/>
<path d="M280.0 264.5 L326.0 264.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="314.0" y="638.4" width="556.0" height="216.3" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="328.0" y="660.4" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">ACTION PATH</text>
<text x="328.0" y="678.4" font-size="13" text-anchor="start" fill="#9da7b3">starts at step 9, the review; a separate path</text>
<rect x="326.0" y="688.4" width="119.5" height="154.3" rx="8" fill="#2D2150" stroke="#A371F7" stroke-width="1.6"/>
<text x="332.0" y="707.4" font-size="14" text-anchor="start" font-weight="700" fill="#E6DAFF">Approval or</text>
<text x="332.0" y="724.9" font-size="14" text-anchor="start" font-weight="700" fill="#E6DAFF">grant (C06)</text>
<text x="332.0" y="745.8" font-size="13" text-anchor="start" fill="#E6DAFF">an exact</text>
<text x="332.0" y="762.9" font-size="13" text-anchor="start" fill="#E6DAFF">approval of</text>
<text x="332.0" y="780.1" font-size="13" text-anchor="start" fill="#E6DAFF">one proposal</text>
<text x="332.0" y="797.3" font-size="13" text-anchor="start" fill="#E6DAFF">(C05), or a</text>
<text x="332.0" y="814.4" font-size="13" text-anchor="start" fill="#E6DAFF">bounded grant</text>
<rect x="463.5" y="688.4" width="119.5" height="154.3" rx="8" fill="#4A3200" stroke="#E3B341" stroke-width="1.6"/>
<text x="469.5" y="707.4" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">Executor</text>
<text x="469.5" y="724.9" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">(action</text>
<text x="469.5" y="742.4" font-size="14" text-anchor="start" font-weight="700" fill="#FFEBC2">gateway)</text>
<text x="469.5" y="763.3" font-size="13" text-anchor="start" fill="#FFEBC2">rechecks at</text>
<text x="469.5" y="780.4" font-size="13" text-anchor="start" fill="#FFEBC2">commit: grant,</text>
<text x="469.5" y="797.6" font-size="13" text-anchor="start" fill="#FFEBC2">evidence,</text>
<text x="469.5" y="814.8" font-size="13" text-anchor="start" fill="#FFEBC2">preconditions,</text>
<text x="469.5" y="831.9" font-size="13" text-anchor="start" fill="#FFEBC2">limits</text>
<rect x="601.0" y="688.4" width="119.5" height="154.3" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="607.0" y="707.4" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">Authoritative</text>
<text x="607.0" y="724.9" font-size="14" text-anchor="start" font-weight="700" fill="#CDE4FF">target</text>
<rect x="738.5" y="688.4" width="119.5" height="154.3" rx="8" fill="#12361F" stroke="#56D364" stroke-width="1.6"/>
<text x="744.5" y="707.4" font-size="14" text-anchor="start" font-weight="700" fill="#D2F8DB">Verified</text>
<text x="744.5" y="724.9" font-size="14" text-anchor="start" font-weight="700" fill="#D2F8DB">receipt (C07)</text>
