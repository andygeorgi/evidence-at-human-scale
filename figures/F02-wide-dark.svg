<text x="324.0" y="456.4" font-size="15" text-anchor="start" font-weight="700" fill="#FFEBC2">Reassessment and invalidation</text>
<text x="324.0" y="477.5" font-size="13" text-anchor="start" fill="#FFEBC2">Corrections, revocations, late evidence, challenges and verified</text>
<text x="324.0" y="494.7" font-size="13" text-anchor="start" fill="#FFEBC2">outcomes arrive here. This step returns to the registry (step 3):</text>
<text x="324.0" y="511.8" font-size="13" text-anchor="start" fill="#FFEBC2">affected derivatives, packets and pending approvals stop being current.</text>
