<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 939" width="880" height="939" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Reference architecture</title>
<desc id="d">Nine numbered steps run from sources to the review of one decision packet. A separate mandatory continuity path branches from the registry. A separate action path starts at the review. A reassessment and invalidation step receives corrections and outcomes and returns to the registry. A control plane constrains every stage and path.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
<rect width="880" height="939" fill="#0d1117"/>
<rect x="10.0" y="10.0" width="280.0" height="844.7" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="24.0" y="34.4" font-size="13" text-anchor="start" font-weight="700" fill="#9da7b3">MAIN PATH</text>
<text x="24.0" y="53.5" font-size="13" text-anchor="start" fill="#9da7b3">nine steps to one review contract</text>
<rect x="50.0" y="66.3" width="230.0" height="77.1" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="60.0" y="90.3" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Sources</text>
<text x="60.0" y="111.4" font-size="13" text-anchor="start" fill="#CDE4FF">records, events,</text>
<text x="60.0" y="128.6" font-size="13" text-anchor="start" fill="#CDE4FF">services, analytics</text>
<circle cx="32.0" cy="87.3" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="91.9" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">1</text>
<rect x="50.0" y="153.4" width="230.0" height="77.1" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="60.0" y="177.3" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Admission</text>
<text x="60.0" y="198.5" font-size="13" text-anchor="start" fill="#CDE4FF">registered producer,</text>
<text x="60.0" y="215.6" font-size="13" text-anchor="start" fill="#CDE4FF">permitted kind</text>
<circle cx="32.0" cy="174.4" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="179.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">2</text>
<path d="M32.0 100.3 L32.0 161.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="240.5" width="230.0" height="59.9" rx="8" fill="#12304F" stroke="#58A6FF" stroke-width="1.6"/>
<text x="60.0" y="264.4" font-size="15" text-anchor="start" font-weight="700" fill="#CDE4FF">Registry (C02)</text>
<text x="60.0" y="285.6" font-size="13" text-anchor="start" fill="#CDE4FF">admitted immutable versions</text>
<circle cx="32.0" cy="261.5" r="12" fill="#58A6FF" stroke="#58A6FF" stroke-width="1.6"/>
<text x="32.0" y="266.1" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">3</text>
<path d="M32.0 187.4 L32.0 248.5" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="50.0" y="310.4" width="230.0" height="95.8" rx="8" fill="#0F3A40" stroke="#39C5CF" stroke-width="1.6"/>
<text x="60.0" y="334.3" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">Authorized retrieval</text>
<text x="60.0" y="353.1" font-size="15" text-anchor="start" font-weight="700" fill="#CFF6F9">(context C01)</text>
<text x="60.0" y="374.2" font-size="13" text-anchor="start" fill="#CFF6F9">candidate evidence</text>
<text x="60.0" y="391.4" font-size="13" text-anchor="start" fill="#CFF6F9">and coverage</text>
<circle cx="32.0" cy="331.4" r="12" fill="#39C5CF" stroke="#39C5CF" stroke-width="1.6"/>
<text x="32.0" y="336.0" font-size="13" text-anchor="middle" font-weight="700" fill="#0d1117">4</text>
<path d="M32.0 274.5 L32.0 318.4" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arr)"/>
