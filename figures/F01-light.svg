<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Information production can outgrow human inspection</title>
<desc id="d">Three cards, each narrower than the one above. Information production keeps growing: records, events, deterministic findings, analytical results and model interpretations. An arrow labeled authorize, select, label leads to the decision context card. An arrow labeled one decision packet leads to the Decision Owner card, labeled finite attention and accountable.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="360" height="393" fill="#ffffff"/>
<rect x="10.0" y="10.0" width="340.0" height="98.5" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="180.0" y="34.0" font-size="15" text-anchor="middle" font-weight="700" fill="#0B2540">Information production</text>
<text x="180.0" y="52.7" font-size="15" text-anchor="middle" font-weight="700" fill="#0B2540">keeps growing</text>
<text x="180.0" y="74.8" font-size="14" text-anchor="middle" fill="#0B2540">records · events · deterministic findings</text>
<text x="180.0" y="93.3" font-size="14" text-anchor="middle" fill="#0B2540">analytical results · model interpretations</text>
<path d="M180.0 108.5 L180.0 155.5" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="137.1" font-size="13" text-anchor="start" fill="#57606a">authorize · select · label</text>
<rect x="36.0" y="156.5" width="288.0" height="98.2" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="180.0" y="180.4" font-size="15" text-anchor="middle" font-weight="700" fill="#06323A">Decision context</text>
<text x="180.0" y="202.5" font-size="14" text-anchor="middle" fill="#06323A">keeps what could change a</text>
<text x="180.0" y="221.0" font-size="14" text-anchor="middle" fill="#06323A">decision and shows its source,</text>
<text x="180.0" y="239.5" font-size="14" text-anchor="middle" fill="#06323A">scope, gaps and owner</text>
<path d="M180.0 254.7 L180.0 301.6" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="283.2" font-size="13" text-anchor="start" fill="#57606a">one decision packet</text>
<rect x="72.0" y="302.6" width="216.0" height="79.7" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="180.0" y="326.6" font-size="15" text-anchor="middle" font-weight="700" fill="#24133F">Decision Owner</text>
<text x="180.0" y="348.7" font-size="14" text-anchor="middle" fill="#24133F">finite attention</text>
<text x="180.0" y="367.2" font-size="14" text-anchor="middle" fill="#24133F">· accountable</text>
</svg>
