<path d="M707.0 216.0 q0 -26 28 -26 q28 0 28 26 z" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="2"/>
<rect x="646.4" y="232.0" width="83.4" height="32.0" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.4"/>
<text x="688.1" y="252.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0F2E1B">Approve</text>
<text x="744.9" y="253.0" font-size="13" text-anchor="middle" fill="#57606a">or</text>
<rect x="759.9" y="232.0" width="63.7" height="32.0" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.4"/>
<text x="791.7" y="252.4" font-size="13" text-anchor="middle" font-weight="700" fill="#3D2500">Hold</text>
<text x="735.0" y="290.0" font-size="13" text-anchor="middle" fill="#57606a">Current evidence is rechecked</text>
<text x="735.0" y="308.0" font-size="13" text-anchor="middle" fill="#57606a">before action</text>
<path d="M278.0 212.0 L302.0 212.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M592.0 212.0 L616.0 212.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
