<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 408px; background-color: white;" viewBox="4 4 408 888" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Complexity must earn its place against simpler baselines</title><desc id="chart-desc-my-svg">Four steps, each compared with the one before on matched tasks. First the native or current workflow, then deterministic grouping and templates, then simple synthesis with zero specialists, and only then optional specialists, which are justified only by a measured, matched need for permission or isolation. The measures are correctness, omissions, evidence actually inspected, decision quality, time and workload, not fluency or how many agents agree. No evaluation result is claimed: all of this is not run.</desc><style>#my-svg{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;fill:#1B1F24;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#57606A;stroke:#57606A;}#my-svg .marker.cross{stroke:#57606A;}#my-svg svg{font-family:-apple-system,'Segoe UI',Robo