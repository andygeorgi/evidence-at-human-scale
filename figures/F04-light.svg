<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1202" width="360" height="1202" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Anatomy of a decision packet</title>
<desc id="d">The Decision Owner reviews a decision packet of nine groups, G01 to G09. Tags show that claims, inferences and conflicts point to evidence records (C02), coverage and obligations to the selection manifest (C03), and action proposals to action proposal records (C05).</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
<rect width="360" height="1202" fill="#ffffff"/>
<rect x="80.0" y="10.0" width="200.0" height="77.1" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="180.0" y="34.0" font-size="15" text-anchor="middle" font-weight="700" fill="#24133F">Decision Owner</text>
<text x="180.0" y="55.1" font-size="13" text-anchor="middle" fill="#24133F">reviews,</text>
<text x="180.0" y="72.3" font-size="13" text-anchor="middle" fill="#24133F">challenges, decides</text>
<path d="M180.0 87.1 L180.0 110.1" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="10.0" y="111.1" width="340.0" height="741.3" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="135.4" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">DECISION PACKET (C04)</text>
<text x="24.0" y="154.6" font-size="13" text-anchor="start" fill="#57606a">nine groups; a tag names</text>
<text x="24.0" y="171.7" font-size="13" text-anchor="start" fill="#57606a">what a group points to</text>
<rect x="22.0" y="184.5" width="316.0" height="77.1" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="208.5" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">G01 Context and as-of</text>
<text x="32.0" y="229.6" font-size="13" text-anchor="start" fill="#0F2E1B">one context, selection and as-of time;</text>
<text x="32.0" y="246.8" font-size="13" text-anchor="start" fill="#0F2E1B">everything below is bound to them</text>
<rect x="22.0" y="269.6" width="316.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<rect x="283.8" y="277.6" width="44.2" height="23.0" rx="11.5" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.4"/>
<text x="305.9" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#0B2540">C02</text>
<text x="32.0" y="293.6" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">G02 Supported claims</text>
<text x="32.0" y="314.7" font-size="13" text-anchor="start" fill="#0F2E1B">each cites an exact record version</text>
<rect x="22.0" y="337.5" width="316.0" height="59.9" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<rect x="283.8" y="345.5" width="44.2" height="23.0" rx="11.5" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.4"/>
<text x="305.9" y="361.4" font-size="13" text-anchor="middle" font-weight="700" fill="#0B2540">C02</text>
<text x="32.0" y="361.5" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">G03 Labeled inferences</text>
<text x="32.0" y="382.6" font-size="13" text-anchor="start" fill="#3D2500">method and limits; never claims</text>
<rect x="22.0" y="405.4" width="316.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="429.4" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">G04 Recommendations</text>
<text x="32.0" y="450.5" font-size="13" text-anchor="start" fill="#0F2E1B">with the accountable review requirement</text>
<rect x="22.0" y="473.3" width="316.0" height="78.7" rx="8" fill="#FBE4E4" stroke="#B3261E" stroke-width="1.6"/>
<rect x="283.8" y="481.3" width="44.2" height="23.0" rx="11.5" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.4"/>
<text x="305.9" y="497.3" font-size="13" text-anchor="middle" font-weight="700" fill="#0B2540">C02</text>
<text x="32.0" y="497.3" font-size="15" text-anchor="start" font-weight="700" fill="#3D0A07">G05 Conflicts</text>
<text x="32.0" y="516.0" font-size="15" text-anchor="start" font-weight="700" fill="#3D0A07">and uncertainty</text>
<text x="32.0" y="537.2" font-size="13" text-anchor="start" fill="#3D0A07">visible, never settled by majority</text>
<rect x="22.0" y="560.0" width="316.0" height="78.7" rx="8" fill="#FFF1D6" stroke="#A15F00" stroke-width="1.6"/>
<rect x="283.8" y="568.0" width="44.2" height="23.0" rx="11.5" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.4"/>
<text x="305.9" y="583.9" font-size="13" text-anchor="middle" font-weight="700" fill="#06323A">C03</text>
<text x="32.0" y="584.0" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">G06 Coverage,</text>
<text x="32.0" y="602.7" font-size="15" text-anchor="start" font-weight="700" fill="#3D2500">omissions, gaps</text>
<text x="32.0" y="623.9" font-size="13" text-anchor="start" fill="#3D2500">seven missingness labels</text>
<rect x="22.0" y="646.7" width="316.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<rect x="283.8" y="654.7" width="44.2" height="23.0" rx="11.5" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.4"/>
<text x="305.9" y="670.6" font-size="13" text-anchor="middle" font-weight="700" fill="#06323A">C03</text>
<text x="32.0" y="670.6" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">G07 Obligations</text>
<text x="32.0" y="691.8" font-size="13" text-anchor="start" fill="#0F2E1B">priority and mandatory items</text>
<rect x="22.0" y="714.6" width="316.0" height="59.9" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<rect x="283.8" y="722.6" width="44.2" height="23.0" rx="11.5" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.4"/>
<text x="305.9" y="738.5" font-size="13" text-anchor="middle" font-weight="700" fill="#24133F">C05</text>
<text x="32.0" y="738.5" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">G08 Action proposals</text>
<text x="32.0" y="759.7" font-size="13" text-anchor="start" fill="#24133F">proposed, not executed</text>
<rect x="22.0" y="782.5" width="316.0" height="59.9" rx="8" fill="#E6F4EA" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="32.0" y="806.4" font-size="15" text-anchor="start" font-weight="700" fill="#0F2E1B">G09 Review and version history</text>
<text x="32.0" y="827.6" font-size="13" text-anchor="start" fill="#0F2E1B">revised versions stay distinguishable</text>
<path d="M180.0 852.4 L180.0 879.4" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="190.0" y="871.0" font-size="13" text-anchor="start" fill="#57606a">tags point to</text>
<rect x="10.0" y="880.4" width="340.0" height="311.5" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="24.0" y="904.7" font-size="13" text-anchor="start" font-weight="700" fill="#57606a">WHAT THE TAGS POINT TO</text>
<rect x="22.0" y="917.6" width="316.0" height="94.2" rx="8" fill="#E8F1FB" stroke="#2F6DB5" stroke-width="1.6"/>
<text x="32.0" y="941.5" font-size="15" text-anchor="start" font-weight="700" fill="#0B2540">C02 Evidence</text>
<text x="32.0" y="962.7" font-size="13" text-anchor="start" fill="#0B2540">records by exact version, claim</text>
<text x="32.0" y="979.8" font-size="13" text-anchor="start" fill="#0B2540">or payload pointer, original</text>
<text x="32.0" y="997.0" font-size="13" text-anchor="start" fill="#0B2540">locator, scope, method, lifecycle</text>
<rect x="22.0" y="1019.8" width="316.0" height="77.1" rx="8" fill="#E4F4F6" stroke="#1E7F8C" stroke-width="1.6"/>
<text x="32.0" y="1043.7" font-size="15" text-anchor="start" font-weight="700" fill="#06323A">C03 Selection manifest</text>
<text x="32.0" y="1064.9" font-size="13" text-anchor="start" fill="#06323A">what was retrieved, kept,</text>
<text x="32.0" y="1082.0" font-size="13" text-anchor="start" fill="#06323A">excluded and missing</text>
<rect x="22.0" y="1104.9" width="316.0" height="77.1" rx="8" fill="#EFE9F7" stroke="#6A4BA1" stroke-width="1.6"/>
<text x="32.0" y="1128.8" font-size="15" text-anchor="start" font-weight="700" fill="#24133F">C05 Action proposal</text>
<text x="32.0" y="1150.0" font-size="13" text-anchor="start" fill="#24133F">records with evidence,</text>
<text x="32.0" y="1167.1" font-size="13" text-anchor="start" fill="#24133F">preconditions, accounting</text>
</svg>
